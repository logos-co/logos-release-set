name: "Driving the Basecamp UI against the pinned release set"
output: basecamp-ui.md
release: ""

intro: |
  This doc-test drives Basecamp's real UI against every module and UI app the
  release set pins: it downloads them from the catalog with `logosctl`, installs
  them into a user directory with `lgpm`, launches Basecamp headless, and walks
  the interface through the QML inspector — waiting for elements, clicking into
  views, asserting on what renders, and capturing screenshots.

  It runs on Linux and macOS, and on Windows through
  [logos-windows-ci](https://github.com/logos-co/logos-windows-ci): Nix does not
  run there, so CI cross-builds Basecamp's inspector bundle and test driver at
  the pinned commit on Linux and stages them, with the pinned `logosctl` and
  `lgpm` releases, beside the script `doctest emit-smoke` generates from this
  spec's Windows steps. Windows installs only the packages that publish a
  Windows variant.

  **Why this builds Basecamp instead of downloading it.** The QML inspector is a
  compile-time feature and is deliberately off in every shipping artifact, so
  the released AppImage cannot be driven by a test harness. This spec therefore
  builds `#bin-bundle-dir-inspector` — the inspector-enabled twin of the shipping
  portable bundle — **at the exact commit the release set resolved for Basecamp**.
  Same source, same portable packaging, inspector on.

  The shipped artifact itself is covered by
  [`basecamp-appimage-smoke`](basecamp-appimage-smoke.md). Together they say:
  the binary users download starts cleanly, and the code inside it drives a
  working UI.

what_you_build: "Basecamp at the pinned commit, driven headlessly against a user directory holding every module and UI app in the release set."

what_you_learn:
  - How to populate a Basecamp `--user-dir` from the module catalog
  - Why the UI test rebuilds the pinned commit instead of using the release asset
  - How to drive a Qt/QML app headlessly with `logos-qt-mcp`
  - How to assert that installed UI plugins actually appear in the running app

prerequisites:
  - "**A Linux or macOS machine** (linux-x86_64, linux-arm64 or macos-arm64), or the Windows leg's staged tree."
  - "**Nix** with flakes enabled — builds the inspector-enabled bundle and the test driver."
  - "**On Windows:** `bin-bundle-dir-inspector/`, `logos-qt-mcp/`, `logosctl/`, `lgpm/` and `release-set/` staged by logos-windows-ci, plus Git Bash, Python 3 and Node.js."
  - "**On Linux:** the usual desktop graphics libraries (`libopengl0`, `libgl1`, `libegl1`). The portable bundle loads them from the host, exactly as it would on a real desktop."
  - "**`RELEASE_SET_DIR`** pointing at the `logos-release-set` checkout, and **`GITHUB_TOKEN`** set (resolving the set hits the GitHub API)."

sections:
  - title: "Resolve the release set"
    step: true
    text: |
      The resolver turns the pinned tags and versions into
      `release-set.lock.json`. The Basecamp entry's `commit` is what this spec
      builds — the release tag resolved to an immutable sha.
    steps:
      - title: "Resolve"
        platform: [linux, macos]
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" lock'
        code_block: "./doctests/release-set.sh lock"
        check_file: "release-set.lock.json"
      - title: "Show the Basecamp commit under test"
        platform: [linux, macos]
        run: |
          "$RELEASE_SET_DIR/doctests/release-set.sh" field apps logos-basecamp tag
          "$RELEASE_SET_DIR/doctests/release-set.sh" field apps logos-basecamp commit
        code_block: "./doctests/release-set.sh field apps logos-basecamp commit"
      - title: "Read the pins"
        platform: windows
        text: |
          Windows resolves nothing. CI read the lock on Linux, cross-built
          Basecamp at its `commit`, and staged `release-set.json` with a helper
          that reads it.
        run: "bash release-set/windows.sh pins"
        code_block: "bash release-set/windows.sh pins"
        expect_contains:
          - "logos-basecamp"

  - title: "Populate a user directory from the catalog"
    step: true
    text: |
      Every module and UI app in the release set, at its pinned version,
      checksum-verified against the catalog index, installed into one
      `--user-dir` tree. `lgpm` routes each package by its manifest `type`:
      `core` to `--modules-dir`, `ui_qml` to `--ui-plugins-dir`. On Windows,
      the packages that publish no Windows variant are skipped and named.
    steps:
      - title: "Fetch logosctl and lgpm"
        platform: [linux, macos]
        run: |
          "$RELEASE_SET_DIR/doctests/release-set.sh" fetch logos-logoscore-cli logosctl
          "$RELEASE_SET_DIR/doctests/release-set.sh" fetch logos-package-manager lgpm
        code_block: |
          ./doctests/release-set.sh fetch logos-logoscore-cli logosctl
          ./doctests/release-set.sh fetch logos-package-manager lgpm
        check_file: "bin/lgpm"
      - title: "Use the staged releases"
        platform: windows
        text: |
          On Windows the pinned releases' `logosctl-x86_64-windows.zip` and
          `lgpm-x86_64-windows.zip` are already here, unpacked as `logosctl/`
          and `lgpm/`. The helper writes the same `./bin/` wrappers as `fetch`
          does elsewhere.
        run: |
          bash release-set/windows.sh link logosctl
          bash release-set/windows.sh link lgpm
        code_block: |
          bash release-set/windows.sh link logosctl
          bash release-set/windows.sh link lgpm
        check_file: "bin/lgpm"
      - title: "Start a logosctl daemon to download with"
        text: |
          Downloads are served by the `package_downloader` module inside the
          daemon, so it starts first, in a session of its own. Its `HOME` is
          inside this run's directory, because the package downloader also
          starts a storage node, whose default data directory is
          `~/.logos_storage`.
        platform: [linux, macos]
        run: |
          mkdir -p home
          HOME="$(pwd)/home" ./bin/logosctl --config-dir ./session daemon start --detach
        code_block: "logosctl --config-dir ./session daemon start --detach"
      - title: "Start a logosctl daemon to download with"
        platform: windows
        text: |
          The same command. `logosctl` is a native Windows program, so `HOME`
          is given in Windows form; the storage module reads it before
          `USERPROFILE`.
        run: |
          mkdir -p home
          HOME="$(cygpath -m "$PWD")/home" ./bin/logosctl --config-dir ./session daemon start --detach
        code_block: "logosctl --config-dir ./session daemon start --detach"
      - title: "Install everything the set pins"
        platform: [linux, macos]
        run: |
          mkdir -p testdata/modules testdata/plugins
          MODULES_DIR=./testdata/modules PLUGINS_DIR=./testdata/plugins \
            "$RELEASE_SET_DIR/doctests/release-set.sh" install-all
        code_block: |
          logosctl --config-dir ./session package download <each> --version <pinned> -o packages
          lgpm --modules-dir ./testdata/modules --ui-plugins-dir ./testdata/plugins \
               install --file packages/<each>.lgx
        expect_contains:
          - "sha256 OK"
      - title: "Install everything that publishes a Windows variant"
        platform: windows
        text: |
          The same two commands per package. With no lock on Windows, the helper
          takes each expected `sha256`, and whether a Windows variant exists,
          from the catalog index the resolver reads.
        run: |
          mkdir -p testdata/modules testdata/plugins
          MODULES_DIR=./testdata/modules PLUGINS_DIR=./testdata/plugins \
            bash release-set/windows.sh install-all
        code_block: |
          logosctl --config-dir ./session package download <each> --version <pinned> -o packages
          lgpm --modules-dir ./testdata/modules --ui-plugins-dir ./testdata/plugins \
               install --file packages/<each>.lgx
        expect_contains:
          - "sha256 OK"
      - title: "See what landed where"
        run: |
          echo "--- core modules ---"; ls testdata/modules
          echo "--- ui plugins ---";   ls testdata/plugins
        code_block: |
          ls testdata/modules
          ls testdata/plugins
        expect_contains:
          - "storage_ui"
      - title: "Stop the download daemon"
        run: |
          trap '' TERM
          ./bin/logosctl --config-dir ./session daemon stop || true
          true
        code_block: "logosctl --config-dir ./session daemon stop"

  - title: "Build the app under test"
    step: true
    platform: [linux, macos]
    text: |
      `#bin-bundle-dir-inspector` at the resolved commit: the portable bundle,
      identical to the shipping one except the QML inspector is compiled in so
      `logos-qt-mcp` can attach. Portable matters — the catalog packages in the
      user directory are portable variants, and a dev build would RPATH into
      `/nix/store` and refuse to load beside them. The test driver comes from
      the same commit. Each out-link is named after its output: on Windows,
      logos-windows-ci stages the same outputs under those names, so the next
      section's launch line serves every platform.
    steps:
      - title: "Build Basecamp at the pinned commit"
        run: |
          COMMIT="$("$RELEASE_SET_DIR/doctests/release-set.sh" field apps logos-basecamp commit)"
          nix build "github:logos-co/logos-basecamp/$COMMIT#bin-bundle-dir-inspector" -o bin-bundle-dir-inspector
        code_block: "nix build 'github:logos-co/logos-basecamp/<pinned commit>#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector"
        check_file: "bin-bundle-dir-inspector/bin/LogosBasecamp"
      - title: "Build the test driver"
        run: |
          COMMIT="$("$RELEASE_SET_DIR/doctests/release-set.sh" field apps logos-basecamp commit)"
          nix build "github:logos-co/logos-basecamp/$COMMIT#logos-qt-mcp" -o logos-qt-mcp
        code_block: "nix build 'github:logos-co/logos-basecamp/<pinned commit>#logos-qt-mcp' -o logos-qt-mcp"
        check_file: "logos-qt-mcp"

  - title: "Launch it and walk the UI"
    step: true
    text: |
      The app launches headless (`QT_QPA_PLATFORM=offscreen`) against the user
      directory we just populated, with `HOME` and `USERPROFILE` pointed into
      this run so nothing it writes lands in the real home directory, and
      `LOGOS_NO_SCHEME_REGISTER=1` so it does not register itself as the
      `basecamp://` handler. Every assertion below is a real round-trip
      through the running app: the sidebar renders, the views load, and the UI
      plugins installed from the catalog show up where a user would find them.
      Windows walks the same views and asserts the packages that publish a
      Windows variant.
    steps:
      - title: "Launch and drive Basecamp"
        platform: [linux, macos]
        ui_test: &walk
          setup:
            - "mkdir -p app-home"
          launch: 'env HOME="$PWD/app-home" USERPROFILE="$PWD/app-home" LOGOS_NO_SCHEME_REGISTER=1 ./bin-bundle-dir-inspector/bin/LogosBasecamp{exe} --user-dir "$PWD/testdata"'
          qt_mcp: "logos-qt-mcp"
          # A cold first boot has to load every core module in the user-dir
          # before the QML tree settles, so allow well past the default wait.
          launch_timeout: 600
          tests:
            - &launched
              name: "App window opens with the sidebar visible"
              action: wait_for
              texts: ["Applications", "Package Manager", "Settings"]
              timeout: 120000
              text: "Basecamp launches headless against the release set's user directory. The sidebar renders with **Applications**, **Package Manager** and **Settings**."
              screenshot: "basecamp-launch.png"

            - &open_apps
              name: "Open the Applications view"
              action: click
              target: "Applications"

            - &apps_loaded
              name: "Applications view loads"
              action: wait_for
              texts: ["Install and manage applications."]
              timeout: 60000
              text: "The **Applications** view lists what is installed — every UI app this release set pins."
              screenshot: "basecamp-applications.png"

            - &open_settings
              name: "Open Settings"
              action: click
              target: "Settings"

            - &settings_loaded
              name: "Settings view loads"
              action: wait_for
              texts: ["Manage modules, apps and dashboards.", "Sections"]
              timeout: 60000
              screenshot: "basecamp-settings.png"

            # Settings opens on Dashboard. Basecamp 0.2.3 presents the installed
            # UI plugins and core modules in separate inspectors, so open the
            # Apps Inspector before waiting for its asynchronous refresh.
            - &open_apps_inspector
              name: "Open Settings → Apps Inspector"
              action: click
              target: "Apps Inspector"

            - &apps_inspector_loaded
              name: "The Apps Inspector loads"
              action: wait_for
              texts: ["Apps Inspector", "UI plugins available in this installation."]
              timeout: 60000
              text: "The UI plugins installed from the catalog appear in **Settings → Apps Inspector**."
              screenshot: "basecamp-ui-modules.png"

            # The assertion that actually ties this test to the release set —
            # asserting only Basecamp's own chrome would pass against an empty
            # user directory.
            #
            # These must be the EXACT rendered labels. `wait_for` resolves to
            # the inspector's findByProperty, which compares the `text` property
            # for equality — no substring, no case folding. (`click` is the one
            # that matches partially and case-insensitively, via findAndClick;
            # do not carry that assumption over to text assertions.)
            #
            # Rows render `displayName || name`, so the label depends on whether
            # a given release ships a display_name: at these pins Storage, Chat,
            # Blockchain, LEZ Explorer and LEZ Wallet all have display names.
            # Re-check these strings against the settled screenshot when bumping
            # pins. Opening the inspector kicks off an async refresh (getInstalledUiPlugins
            # + getInstalledPackages + per-package dependency resolution) and
            # the model is rebuilt when it lands. Asserting while the spinner is
            # still up reads a half-populated list. Settle first, and capture
            # the settled frame here rather than on the assertion step — a
            # failing step captures nothing, so this is the screenshot that
            # shows what the assertion actually saw.
            - &plugins_settled
              name: "Let the plugin list finish refreshing"
              action: sleep
              ms: 10000
              screenshot: "basecamp-ui-modules-settled.png"

            - name: "The release set's UI apps are listed"
              action: wait_for
              texts: ["Storage", "Chat", "Blockchain", "LEZ Explorer", "LEZ Wallet"]
              timeout: 60000
              text: "Each UI app this release set pins appears as a row — installed from the catalog, loaded by the app."
              screenshot: "basecamp-ui-modules-list.png"

            - &open_module_inspector
              name: "Open Settings → Module Inspector"
              action: click
              target: "Module Inspector"

            - &module_inspector_loaded
              name: "The Module Inspector loads"
              action: wait_for
              texts: ["Module Inspector", "Core modules known to the runtime, with live resource usage."]
              timeout: 60000
              text: "And the core modules the release set pins appear alongside them."
              screenshot: "basecamp-core-modules.png"

            # Switching inspectors triggers a core-module refresh; settle before
            # asserting, for the same reason as the Apps Inspector above.
            - &core_settled
              name: "Let the core module list finish refreshing"
              action: sleep
              ms: 10000
              screenshot: "basecamp-core-modules-settled.png"

            # Exact labels again, from the same `displayName || name` rule: at
            # these pins the core modules render their display names, including
            # "Blockchain Module" and "LEZ Core Module".
            - name: "The release set's core modules are listed"
              action: wait_for
              texts: ["Storage Module", "Chat Module", "Blockchain Module", "LEZ Core Module", "libp2p Networking"]
              timeout: 60000
              text: "The core modules are present too, so the dependencies the UI apps need are really loaded."
              screenshot: "basecamp-core-modules-list.png"
      - title: "Launch and drive Basecamp"
        platform: windows
        ui_test:
          <<: *walk
          tests:
            - *launched
            - *open_apps
            - *apps_loaded
            - *open_settings
            - *settings_loaded
            - *open_apps_inspector
            - *apps_inspector_loaded
            - *plugins_settled
            - name: "The release set's UI apps are listed"
              action: wait_for
              texts: ["Storage", "Chat"]
              timeout: 60000
              text: "The UI apps that publish a Windows variant appear as rows: Storage and Chat."
              screenshot: "basecamp-ui-modules-list.png"
            - *open_module_inspector
            - *module_inspector_loaded
            - *core_settled
            - name: "The release set's core modules are listed"
              action: wait_for
              texts: ["Storage Module", "Chat Module", "Delivery Module"]
              timeout: 60000
              text: "And the core modules they need, which publish Windows variants too."
              screenshot: "basecamp-core-modules-list.png"
        post_text: |
          Every element asserted above rendered from a user directory built
          entirely out of this release set: the modules and UI plugins came from
          the catalog at their pinned versions, and the app hosting them is the
          pinned Basecamp commit. That is the set working together, not just
          each part working alone.
