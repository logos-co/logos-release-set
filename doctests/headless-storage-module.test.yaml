name: "Validating the pinned storage_module"
output: headless-storage-module.md
release: ""

intro: |
  This doc-test validates the `storage_module` pinned by
  [`release-set.json`](../release-set.json) — not the latest `master`, not a
  local build: **exactly the artifacts a user would install**.

  Everything runs from released binaries. `logosctl` — the runtime and the
  package manager in one — is downloaded from its GitHub release at the tag the
  release set pins; `storage_module` is pulled from the module catalog at the
  pinned version and installed into the session, checksum-verified against the
  catalog index. The node comes up as the
  [Run a Logos node](https://docs.logos.co/run-a-node) guide describes for
  Testnet v0.3: the package downloader starts it.

  Then it goes two steps further than "the module loads". It builds a small
  **probe module** with the `logos-module-builder` release the set pins, and
  uses that probe to call `storage_module` and subscribe to one of its events
  from inside the runtime. Finally it loads the pinned **`openmetrics`** module
  and scrapes `/metrics` over HTTP, proving the storage module's metrics reach
  a real endpoint.

  A green run means the pinned storage module is installable, loadable,
  callable, emits the events other modules depend on, and reports metrics.

  The spec runs on Windows too. Nix does not run there, so CI prepares that leg
  on Linux: it unpacks the pinned release's `logosctl-x86_64-windows.zip` and
  cross-builds the probe with the pinned builder, then runs the steps marked
  for Windows on `windows-latest`, metrics included.

what_you_build: "The pinned `storage_module`, installed from the catalog and driven through a `logosctl` daemon and a purpose-built probe module."

what_you_learn:
  - How a release set pins tools by release tag and modules by catalog version
  - How to install an exact module version with `logosctl package download --version`
  - How the package downloader starts the storage node, and how to wait for it
  - How to observe a module's events with `logosctl watch`
  - How to build a probe module that calls a dependency and subscribes to its events
  - Which module serves `/metrics`, and how it scrapes others over IPC
  - How the Windows half runs on artifacts CI prepares on Linux

prerequisites:
  - "**A Linux or macOS machine** (linux-x86_64, linux-arm64 or macos-arm64)."
  - "**Nix** with flakes enabled — used only to build the probe module; the tool and modules under test come from released binaries."
  - "**`RELEASE_SET_DIR`** pointing at the `logos-release-set` checkout, and **`GITHUB_TOKEN`** set (resolving the set hits the GitHub API)."
  - "**For the Windows half**, Git Bash with `curl` and `jq`, in a directory holding this repository's `flake.nix` targets as `logos-windows-ci` stages them: `release-set/`, `logosctl/` and `probe-storage/`."

sections:
  - title: "Resolve the release set"
    step: true
    text: |
      `release-set.json` carries the minimum a human types — a tag per app, a
      version per catalog package. The resolver turns that into
      `release-set.lock.json`: repository URL, commit hash, download URL and
      checksum for every artifact. Every later step reads the lock, so the whole
      doc-test is pinned to one immutable set.
    steps:
      - title: "Resolve"
        platform: [linux, macos]
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" lock'
        code_block: "./doctests/release-set.sh lock"
        check_file: "release-set.lock.json"
        post_text: |
          Each line is a pinned artifact and the commit it was built from. For
          catalog packages that commit is the submodule gitlink in
          `logos-modules-release` at the package's release tag — the exact source
          the `.lgx` was built from.
      - title: "Read the pins"
        platform: windows
        text: |
          Windows resolves nothing. CI read the lock on Linux to pin this leg's
          inputs, the builder tag and the `logosctl` release, and staged
          `release-set.json` with a helper that reads it.
        run: "bash release-set/windows.sh pins"
        code_block: "bash release-set/windows.sh pins"
        expect_contains:
          - "storage_module"

  - title: "Fetch the pinned runtime"
    step: true
    text: |
      `logosctl` is the headless runtime and the package manager in one: it
      loads and drives modules, and it bundles `package_manager` and
      `package_downloader` so installing from the catalog is the same binary's
      job. One artifact, at the tag the release set pins. On Linux it ships as
      an AppImage, which we extract rather than mount — CI runners have no
      FUSE. On macOS it ships as a directory bundle.

      The release publishes the older `logoscore` alongside it, so the fetch
      names the binary it wants rather than taking whichever asset happens to
      match the platform.
    steps:
      - title: "Fetch logosctl"
        platform: [linux, macos]
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" fetch logos-logoscore-cli logosctl'
        code_block: "./doctests/release-set.sh fetch logos-logoscore-cli logosctl"
        check_file: "bin/logosctl"
      - title: "Use the staged release"
        platform: windows
        text: |
          On Windows the pinned release's `logosctl-x86_64-windows.zip` is
          already here, unpacked as `logosctl/`. The helper writes the same
          `./bin/logosctl` wrapper as `fetch` does elsewhere; `logosctl.exe`
          stays in its bundle, next to `logos_host.exe` and the modules it ships.
        run: "bash release-set/windows.sh link logosctl"
        code_block: "bash release-set/windows.sh link logosctl"
        check_file: "bin/logosctl"
      - title: "Confirm the version"
        run: "./bin/logosctl --version"
        code_block: "logosctl --version"

  - title: "Start a session"
    step: true
    text: |
      Everything `logosctl` owns — installed modules, UI plugins, catalogs,
      trusted keys, logs — lives in one **session** directory, and
      `--config-dir` picks which. Pointing it at `./session` keeps this
      doc-test out of `~/.logosctl`, so nothing it installs touches the machine
      that ran it.

      The daemon starts *before* anything is installed: package commands are
      served by the bundled `package_manager`, which lives inside the running
      daemon, and the daemon re-scans its module directories after every
      install.
    steps:
      - title: "Start the daemon"
        text: |
          `--detach` is not `&`. Backgrounding returns before the transports
          have bound; `--detach` returns only once the daemon has published its
          state file and is answering commands, so nothing below races the boot.
          The daemon gets a `HOME` inside this run's directory. As soon as it
          is up, the package downloader starts the storage node with its default
          configuration, which keeps the node's data in `~/.logos_storage`; this
          keeps a run clear of a real node there, such as Basecamp's.
        platform: [linux, macos]
        run: |
          mkdir -p home
          HOME="$(pwd)/home" ./bin/logosctl --config-dir ./session daemon start --detach
        code_block: "logosctl --config-dir ./session daemon start --detach"
      - title: "Start the daemon"
        platform: windows
        text: |
          The same command. `logosctl` is a native Windows program, so `HOME`
          is given in Windows form; the storage module reads it before
          `USERPROFILE`.
        run: |
          mkdir -p home
          HOME="$(cygpath -m "$PWD")/home" ./bin/logosctl --config-dir ./session daemon start --detach
        code_block: "logosctl --config-dir ./session daemon start --detach"
      - title: "Confirm it is up"
        run: "./bin/logosctl --config-dir ./session daemon status"
        code_block: "logosctl daemon status"
        expect_contains:
          - '"status":"running"'
      - title: "Confirm where packages will come from"
        text: |
          `logosctl` ships one catalog enabled by default. It is the same
          `logos-modules-release` catalog `release-set.json` names, so the
          packages installed below come from where the release set says they do.
        run: "./bin/logosctl --config-dir ./session catalog ls"
        code_block: "logosctl catalog ls"
        expect_contains:
          - "logos-co/logos-modules-release"

  - title: "Install the pinned storage_module"
    step: true
    text: |
      `package download --version` pulls that exact version from the catalog —
      the match is an exact string comparison, not a semver range, so the
      release set gets precisely what it asked for. Download and install stay
      two steps rather than one `package install --version`, because the
      release set's claim is about a specific file: the helper hashes the
      `.lgx` against the `sha256` the catalog index publishes before anything
      unpacks it.

      `storage_module` is a `core` module, so it lands in `session/modules`; a
      `ui_qml` plugin would land in `session/plugins`. The routing comes from
      the package's own manifest, so there is no target directory to pass.
    steps:
      - title: "Download, verify and install"
        platform: [linux, macos]
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" ctl-install storage_module'
        code_block: |
          logosctl package download storage_module --version <pinned> -o packages
          logosctl package install --file packages/storage_module-*.lgx -y
        expect_contains:
          - "sha256 OK"
          - '"installed":['
      - title: "Download, verify and install"
        platform: windows
        text: |
          The same two commands. With no lock on Windows, the helper takes the
          expected `sha256` from the catalog index the resolver reads.
        run: "bash release-set/windows.sh ctl-install storage_module"
        code_block: |
          logosctl package download storage_module --version <pinned> -o packages
          logosctl package install --file packages/storage_module-*.lgx -y
        expect_contains:
          - "sha256 OK"
          - '"installed":['
      - title: "Install the metrics scraper too"
        platform: [linux, macos]
        text: |
          `openmetrics` is the module that serves the `/metrics` endpoint later
          in this doc-test.
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" ctl-install openmetrics'
        code_block: |
          logosctl package download openmetrics --version <pinned> -o packages
          logosctl package install --file packages/openmetrics-*.lgx -y
        expect_contains:
          - "sha256 OK"
          - '"installed":['
      - title: "Install the metrics scraper too"
        platform: windows
        run: "bash release-set/windows.sh ctl-install openmetrics"
        code_block: |
          logosctl package download openmetrics --version <pinned> -o packages
          logosctl package install --file packages/openmetrics-*.lgx -y
        expect_contains:
          - "sha256 OK"
          - '"installed":['
      - title: "Confirm what landed"
        text: |
          `SOURCE` separates what this session installed (`user`) from the
          modules shipped read-only beside the binary (`embedded`) — which is
          where `capability_module`, the auth handshake every load needs, comes
          from. Nothing had to be seeded by hand.
        run: "./bin/logosctl --config-dir ./session package ls"
        code_block: "logosctl package ls"
        expect_contains:
          - "storage_module"

  - title: "Build a probe module with the pinned module-builder"
    step: true
    platform: [linux, macos]
    text: |
      Calling a module from the CLI proves it answers. It does not prove that
      *another module* can consume it — the path every real application uses.
      So we build one, with the `logos-module-builder` release this set pins.

      The probe declares `storage_module` as a dependency and supplies the
      contract itself via `dependency_overrides`. That matters: a contract file
      means the probe compiles against the *interface* without building
      `storage_module` from source, so what it talks to at runtime is the
      downloaded `.lgx` and nothing else. (This is the same mechanism
      `logos-chat-module` uses for its `delivery_module` dependency.)
    steps:
      - title: "Write the dependency contract"
        text: |
          Only the subset the probe uses. `logos-lidl` turns this into a typed
          client for the probe.
        file:
          path: probe/deps/storage_module.lidl
          content: |
            ; The subset of storage_module this probe uses, supplied as a
            ; dependency_override so the probe never builds storage_module itself.
            module storage_module {
              method moduleVersion() -> tstr
              method uploadUrl(filePath: tstr, chunkSize: int, advertise: bool) -> result

              event storageUploadDone(payload: tstr)
            }

      - title: "Declare the module"
        file:
          path: probe/metadata.json
          language: json
          content: |
            {
              "name": "probe_storage",
              "display_name": "Storage Probe",
              "version": "1.0.0",
              "type": "core",
              "interface": "universal",
              "category": "test",
              "description": "Calls storage_module and latches one of its events.",
              "main": "probe_storage_plugin",
              "dependencies": ["storage_module"],
              "dependency_overrides": {
                "storage_module": { "file": "deps/storage_module.lidl" }
              },
              "nix": {
                "packages": { "build": [], "runtime": [] },
                "external_libraries": [],
                "cmake": {
                  "find_packages": [],
                  "extra_sources": [],
                  "extra_include_dirs": [],
                  "extra_link_libraries": []
                }
              }
            }

      - title: "Pin the builder to the release set"
        text: |
          The one input that matters: `logos-module-builder` at the tag the
          release set pins. That is what "built with the dev utils this release
          set ships" means concretely.
        run: |
          TAG="$("$RELEASE_SET_DIR/doctests/release-set.sh" pin devUtils logos-module-builder)"
          cat > probe/flake.nix <<EOF
          {
            description = "storage_module probe";
            inputs = {
              logos-module-builder.url = "github:logos-co/logos-module-builder/$TAG";
            };
            outputs = inputs@{ logos-module-builder, ... }:
              logos-module-builder.lib.mkLogosModule {
                src = ./.;
                configFile = ./metadata.json;
                flakeInputs = inputs;
              };
          }
          EOF
          cat probe/flake.nix
        code_block: |
          inputs = {
            logos-module-builder.url = "github:logos-co/logos-module-builder/<pinned tag>";
          };
        check_file: "probe/flake.nix"

      - title: "Write the build file"
        file:
          path: probe/CMakeLists.txt
          language: cmake
          content: |
            cmake_minimum_required(VERSION 3.14)
            project(ProbeStoragePlugin LANGUAGES CXX)

            if(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})
                include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)
            else()
                message(FATAL_ERROR "LogosModule.cmake not found")
            endif()

            file(READ "${CMAKE_CURRENT_SOURCE_DIR}/metadata.json" METADATA_JSON)
            string(JSON MODULE_NAME GET ${METADATA_JSON} name)

            logos_module(
                NAME ${MODULE_NAME}
                SOURCES
                    src/probe_storage_impl.h
                    src/probe_storage_impl.cpp
            )

      - title: "Write the probe"
        text: |
          A universal module: you write the implementation class, and the Qt
          plugin glue is generated from this header. Module code stays Qt-free —
          `std::string`, not `QString`.
        file:
          path: probe/src/probe_storage_impl.h
          language: cpp
          content: |
            #pragma once

            #include <string>
            #include "logos_module_context.h"

            /// Probes the storage_module pinned by the release set: one call in,
            /// one event out. Deriving LogosModuleContext gives us modules() —
            /// typed callers and typed event subscriptions for everything in
            /// metadata.json#dependencies.
            class ProbeStorageImpl : public LogosModuleContext
            {
            public:
                /// Subscribes to storage_module's storageUploadDone event.
                /// Returns "ok" once the subscription is registered.
                std::string subscribe();

                /// The payload of the last storageUploadDone we received.
                /// Empty until one arrives.
                std::string lastUploadEvent();

                /// Round-trips a call into storage_module. Returns a
                /// self-describing string so the doc-test can assert the call
                /// actually succeeded rather than that something was printed.
                std::string targetVersion();

            private:
                std::string m_lastUpload;
            };

      - title: "Write the implementation"
        file:
          path: probe/src/probe_storage_impl.cpp
          language: cpp
          content: |
            #include "probe_storage_impl.h"

            // modules() needs the generated aggregate to be a complete type, so
            // the cross-module calls live here rather than in the header.
            #include "logos_sdk.h"

            std::string ProbeStorageImpl::subscribe()
            {
                const bool ok = modules().storage_module.onStorageUploadDone(
                    [this](const std::string& payload) { m_lastUpload = payload; });
                return ok ? "ok" : "failed";
            }

            std::string ProbeStorageImpl::lastUploadEvent()
            {
                return m_lastUpload;
            }

            std::string ProbeStorageImpl::targetVersion()
            {
                const std::string version = modules().storage_module.moduleVersion();
                return version.empty() ? "probe-call-failed: empty version"
                                       : "probe-call-ok version=" + version;
            }

      - title: "Build it as a portable package"
        text: |
          `#lgx-portable`, not `#lgx`. The host is a released (portable)
          `logosctl` and the storage module came from the catalog as a portable
          variant; a dev build would RPATH into `/nix/store` and refuse to load
          beside them.
          Nix only sees files git knows about, so the probe is committed first.
          The link is named after the target CI cross-builds for Windows, so
          the next step reads the same path on every platform.
        run: |
          cd probe
          git init -q . && git add -A
          nix build '.#lgx-portable' --no-write-lock-file -o ../probe-storage
          ls ../probe-storage/*.lgx
        code_block: |
          git init && git add -A
          nix build '.#lgx-portable' -o ../probe-storage
        check_file: "probe-storage"

      - title: "Install the probe"
        platform: [linux, macos, windows]
        text: |
          A path ending in `.lgx` is read as a file, so this never touches the
          catalog. The probe is unsigned and installs anyway: the session's
          `signature_policy` defaults to `warn`, which is what a locally built
          module needs.

          On Windows, `probe-storage/` holds the probe CI cross-built with the
          same pinned builder from `doctests/probes/storage`: the files above,
          which `scripts/check-probes.py` keeps identical to this spec.
        run: "./bin/logosctl --config-dir ./session package install --file probe-storage/*.lgx -y"
        code_block: "logosctl package install --file probe-storage/*.lgx -y"
        expect_contains:
          - '"installed":['

  - title: "Load the module"
    step: true
    text: |
      Everything installed while the daemon was already running, and it
      re-scanned each time, so there is nothing to restart — the modules are
      visible to it now. Installing is not loading, though: `package install`
      puts files on disk, `module load` starts them.
    steps:
      - title: "List what the daemon can see"
        run: "./bin/logosctl --config-dir ./session module ls"
        code_block: "logosctl module ls"
        expect_contains:
          - "storage_module"
      - title: "Load it"
        text: "Dependencies come with it, always — there is no opt-out."
        run: "./bin/logosctl --config-dir ./session module load storage_module"
        code_block: "logosctl module load storage_module"
        expect_contains:
          - "storage_module"
      - title: "Confirm it is loaded"
        run: "./bin/logosctl --config-dir ./session daemon status"
        code_block: "logosctl daemon status"
        expect_contains:
          - "storage_module"
          - '"status":"loaded"'

  - title: "Wait for the storage node"
    step: true
    text: |
      Testnet v0.3 changed how a storage node comes up. The package downloader
      fetches packages through `storage_module`, so it starts the node itself,
      with its saved configuration or the defaults on first use; as the
      [Run a Logos node](https://docs.logos.co/run-a-node) guide says, there is
      nothing to `init` or `start`. Installing the pinned package reloaded the
      module and the downloader started it again, so the node that comes up is
      the pinned one.
    steps:
      - title: "Wait until it is running"
        text: |
          The node reports running only once its bootstrap dials resolve. On a
          network that cannot reach the bootstrap nodes that took 9 minutes on
          Windows, so this waits up to 12.
        run: |
          deadline=$(( $(date +%s) + 720 ))
          out=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            out="$(./bin/logosctl --config-dir ./session call storage_module isRunning 2>&1)"
            case "$out" in *'"result":true'*) break ;; esac
            sleep 5
          done
          printf '%s\n' "$out"
        code_block: "logosctl call storage_module isRunning"
        expect_contains:
          - '"result":true'
      - title: "Inspect it"
        text: "`debug` reports the node's peer ID (`id`) and its signed peer record (`spr`)."
        run: "./bin/logosctl --config-dir ./session call storage_module debug"
        code_block: "logosctl call storage_module debug | jq .result.value.id"
        expect_contains:
          - "spr"

  - title: "Drive storage_module through the probe"
    step: true
    text: |
      The daemon is already running with the storage node started, so loading the
      probe wires it to the live module. Everything below crosses a real
      inter-module boundary.
    steps:
      - title: "Load the probe"
        run: "./bin/logosctl --config-dir ./session module load probe_storage"
        code_block: "logosctl module load probe_storage"
        expect_contains:
          - "probe_storage"
      - title: "Call storage_module from the probe"
        text: "A cross-module call: probe -> storage_module -> back."
        run: "./bin/logosctl --config-dir ./session call probe_storage targetVersion"
        code_block: "logosctl call probe_storage targetVersion"
        expect_contains:
          - "probe-call-ok version="
      - title: "Subscribe to the event"
        run: "./bin/logosctl --config-dir ./session call probe_storage subscribe"
        code_block: "logosctl call probe_storage subscribe"
        expect_contains:
          # The value, not the envelope: logosctl wraps every successful call
          # in {"status":"ok",...}, so asserting a bare "ok" would pass even
          # when the subscription failed to register.
          - '"result":"ok"'
      - title: "Watch for the upload event"
        run: "sh -c './bin/logosctl --config-dir ./session watch storage_module --event storageUploadDone --json > upload-event.txt 2>&1 & echo $! > watch.pid'"
        code_block: "logosctl watch storage_module --event storageUploadDone --json"
      - run: "sleep 2"
      - title: "Trigger an upload"
        text: |
          Uploading a file makes `storage_module` emit `storageUploadDone`. The
          probe is subscribed, so the payload lands in its state. The third
          argument, `advertise`, announces the new content to the network.
        run: |
          echo "hello from the release set" > hello.txt
          ./bin/logosctl --config-dir ./session call storage_module uploadUrl "$(pwd)/hello.txt" 65536 true
        code_block: 'logosctl call storage_module uploadUrl "$(pwd)/hello.txt" 65536 true'
        expect_contains:
          - '"success":true'
      - title: "Confirm the event arrived"
        run: |
          for i in $(seq 1 30); do grep -q cid upload-event.txt && break; sleep 1; done
          kill "$(cat watch.pid)" 2>/dev/null || true
          cat upload-event.txt
        code_block: "cat upload-event.txt"
        expect_contains:
          - "storageUploadDone"
      - title: "Read the event back out of the probe"
        run: "./bin/logosctl --config-dir ./session call probe_storage lastUploadEvent"
        code_block: "logosctl call probe_storage lastUploadEvent"
        expect_contains:
          - "cid"
        post_text: |
          That payload was produced by the pinned `storage_module`, delivered
          across the runtime's event channel, and captured by a module built with
          the pinned `logos-module-builder`. Calls and events both work in the set
          as pinned.

  - title: "Expose the metrics endpoint"
    step: true
    text: |
      `/metrics` is served by the **`openmetrics`** module itself: it runs an HTTP
      server (libmicrohttpd) and, on every scrape, calls the metrics convention
      method on each module named in its config, merging the results into one
      OpenMetrics document with a `module="<name>"` label injected per series.

      `storage_module` implements the structured `collectMetrics()` convention,
      so it is named as a bare string. (A module that already renders
      OpenMetrics text implements `collectOpenMetricsText()` instead and is named
      as `{"name": "...", "format": "text"}`.)
    steps:
      - title: "Load the scraper"
        run: "./bin/logosctl --config-dir ./session module load openmetrics"
        code_block: "logosctl module load openmetrics"
        expect_contains:
          - "openmetrics"
      - title: "Point it at the storage module"
        file:
          path: openmetrics.json
          language: json
          content: |
            {
              "port": 9464,
              "modules": ["storage_module"]
            }
      - title: "Start the server"
        run: "./bin/logosctl --config-dir ./session call openmetrics start @openmetrics.json"
        code_block: "logosctl call openmetrics start @openmetrics.json"
        expect_contains:
          - '"result":1'
      - title: "Confirm it is serving"
        run: "./bin/logosctl --config-dir ./session call openmetrics getInfo"
        code_block: "logosctl call openmetrics getInfo"
        expect_contains:
          - '\"running\":true'
      - title: "Scrape /metrics"
        text: |
          One HTTP request drives a live collection call into `storage_module`
          from the server thread. The `module="storage_module"` label is proof the
          series came from the pinned module rather than from the scraper itself;
          `# EOF` is the OpenMetrics document terminator.
        run: "curl -s --max-time 30 http://127.0.0.1:9464/metrics"
        code_block: "curl http://127.0.0.1:9464/metrics"
        expect_contains:
          - 'module="storage_module"'
          - "# EOF"
      - title: "Stop the server"
        run: "./bin/logosctl --config-dir ./session call openmetrics stop"
        code_block: "logosctl call openmetrics stop"
        expect_contains:
          - '"result":1'

  - title: "Shut down"
    step: true
    text: "Stop the daemon and confirm it exited cleanly."
    steps:
      - title: "Stop"
        run: |
          trap '' TERM
          ./bin/logosctl --config-dir ./session daemon stop || true
          true
      - run: "sleep 2"
      - title: "Confirm"
        run: "./bin/logosctl --config-dir ./session daemon status || true"
        code_block: "logosctl daemon status"
        expect_contains:
          - '"status":"not_running"'
