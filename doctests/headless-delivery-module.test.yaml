name: "Validating the pinned delivery_module"
output: headless-delivery-module.md
release: ""

intro: |
  This doc-test validates the `delivery_module` pinned by
  [`release-set.json`](../release-set.json), using only released artifacts:
  `logosctl` — the runtime and the package manager in one — downloaded from its
  GitHub release at the pinned tag, and `delivery_module` pulled from the module
  catalog at the pinned version and checksum-verified before install.

  Initialization follows the
  [Run a Logos node](https://docs.logos.co/run-a-node) guide for Testnet v0.3,
  adjusted for a CI host with no public IP.

  A **probe module** — built with the `logos-module-builder` release this set
  pins — is loaded before the node starts, so it can subscribe to
  `delivery_module`'s `nodeStarted` event and catch it as the node comes up.
  That makes the event assertion deterministic: it does not depend on the node
  finding peers.

  Finally the pinned **`openmetrics`** module is loaded and `/metrics` scraped
  over HTTP. `delivery_module` is the rendered-text kind of metrics source, so
  this also exercises the scraper's parse-and-merge path.

  The spec runs on Windows too. Nix does not run there, so CI prepares that leg
  on Linux: it unpacks the pinned release's `logosctl-x86_64-windows.zip` and
  cross-builds the probe with the pinned builder, then runs the steps marked
  for Windows on `windows-latest`. `openmetrics` publishes no Windows build, so
  the metrics section runs on Linux and macOS only.

what_you_build: "The pinned `delivery_module`, installed from the catalog, started headlessly, and observed through a purpose-built probe module."

what_you_learn:
  - How a release set pins tools by release tag and modules by catalog version
  - How to install an exact module version with `logosctl package download --version`
  - How to create and start a delivery node headlessly, following the Run a Logos node guide
  - How to subscribe to a dependency's typed events from another module
  - Why a probe subscribes before the lifecycle call that fires the event
  - 'Which module serves `/metrics`, and how `"format": "text"` picks the collection convention'
  - How the Windows half runs on artifacts CI prepares on Linux

prerequisites:
  - "**A Linux or macOS machine** (linux-x86_64, linux-arm64 or macos-arm64)."
  - "**Nix** with flakes enabled — used only to build the probe module; the tool and modules under test come from released binaries."
  - "**`RELEASE_SET_DIR`** pointing at the `logos-release-set` checkout, and **`GITHUB_TOKEN`** set (resolving the set hits the GitHub API)."
  - "**For the Windows half**, Git Bash with `curl` and `jq`, in a directory holding this repository's `flake.nix` targets as `logos-windows-ci` stages them: `release-set/`, `logosctl/` and `probe-delivery/`."

sections:
  - title: "Resolve the release set"
    step: true
    text: |
      The resolver turns the pinned tags and versions in `release-set.json` into
      `release-set.lock.json` — repository URL, commit, download URL and checksum
      for every artifact. Every later step reads the lock.
    steps:
      - title: "Resolve"
        platform: [linux, macos]
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" lock'
        code_block: "./doctests/release-set.sh lock"
        check_file: "release-set.lock.json"
      - title: "Read the pins"
        platform: windows
        text: |
          Windows resolves nothing. CI read the lock on Linux to pin this leg's
          inputs, the builder tag and the `logosctl` release, and staged
          `release-set.json` with a helper that reads it.
        run: "bash release-set/windows.sh pins"
        code_block: "bash release-set/windows.sh pins"
        expect_contains:
          - "delivery_module"

  - title: "Fetch the pinned runtime"
    step: true
    text: |
      `logosctl` is the headless runtime and the package manager in one — it
      bundles `package_manager` and `package_downloader`, so one artifact does
      the whole job. Downloaded at the tag the release set pins. The Linux
      artifact is an AppImage, which we extract rather than mount — CI runners
      have no FUSE.

      The release publishes the older `logoscore` alongside it, so the fetch
      names the binary it wants rather than taking whichever asset happens to
      match the platform.
    steps:
      - title: "Fetch logosctl"
        platform: [linux, macos]
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" fetch logos-logoscore-cli logosctl'
        code_block: "./doctests/release-set.sh fetch logos-logoscore-cli logosctl"
        check_file: "bin/logosctl"
      - title: "Use the staged release"
        platform: windows
        text: |
          On Windows the pinned release's `logosctl-x86_64-windows.zip` is
          already here, unpacked as `logosctl/`. The helper writes the same
          `./bin/logosctl` wrapper as `fetch` does elsewhere; `logosctl.exe`
          stays in its bundle, next to `logos_host.exe` and the modules it ships.
        run: "bash release-set/windows.sh link logosctl"
        code_block: "bash release-set/windows.sh link logosctl"
        check_file: "bin/logosctl"

  - title: "Start a session"
    step: true
    text: |
      Everything `logosctl` owns — installed modules, catalogs, trusted keys,
      logs — lives in one **session** directory, and `--config-dir` picks which.
      Pointing it at `./session` keeps this doc-test out of `~/.logosctl`.

      The daemon starts *before* anything is installed: package commands are
      served by the bundled `package_manager`, which lives inside the running
      daemon, and the daemon re-scans its module directories after every
      install. `capability_module` — the auth handshake every load needs — is
      bundled beside the binary too, so nothing has to be seeded by hand.
    steps:
      - title: "Start the daemon"
        text: |
          `--detach` is not `&`. Backgrounding returns before the transports
          have bound; `--detach` returns only once the daemon has published its
          state file and is answering commands.
          The daemon gets a `HOME` inside this run's directory. As soon as it
          is up, the package downloader starts the storage node with its default
          configuration, which keeps the node's data in `~/.logos_storage`; this
          keeps a run clear of a real node there, such as Basecamp's.
        platform: [linux, macos]
        run: |
          mkdir -p home
          HOME="$(pwd)/home" ./bin/logosctl --config-dir ./session daemon start --detach
        code_block: "logosctl --config-dir ./session daemon start --detach"
      - title: "Start the daemon"
        platform: windows
        text: |
          The same command. `logosctl` is a native Windows program, so `HOME`
          is given in Windows form; the storage module reads it before
          `USERPROFILE`.
        run: |
          mkdir -p home
          HOME="$(cygpath -m "$PWD")/home" ./bin/logosctl --config-dir ./session daemon start --detach
        code_block: "logosctl --config-dir ./session daemon start --detach"
      - title: "Confirm it is up"
        run: "./bin/logosctl --config-dir ./session daemon status"
        code_block: "logosctl daemon status"
        expect_contains:
          - '"status":"running"'
      - title: "Confirm where packages will come from"
        text: |
          The catalog `logosctl` enables by default is the same
          `logos-modules-release` catalog `release-set.json` names.
        run: "./bin/logosctl --config-dir ./session catalog ls"
        code_block: "logosctl catalog ls"
        expect_contains:
          - "logos-co/logos-modules-release"

  - title: "Install the pinned delivery_module"
    step: true
    text: |
      `package download --version` matches the version exactly — no semver
      ranges — so the release set gets precisely what it pinned. Download and
      install stay two steps rather than one `package install --version`: the
      release set's claim is about a specific file, so the helper hashes the
      `.lgx` against the catalog's published `sha256` before anything unpacks it.
    steps:
      - title: "Download, verify and install"
        platform: [linux, macos]
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" ctl-install delivery_module'
        code_block: |
          logosctl package download delivery_module --version <pinned> -o packages
          logosctl package install --file packages/delivery_module-*.lgx -y
        expect_contains:
          - "sha256 OK"
          - '"installed":['
      - title: "Download, verify and install"
        platform: windows
        text: |
          The same two commands. With no lock on Windows, the helper takes the
          expected `sha256` from the catalog index the resolver reads.
        run: "bash release-set/windows.sh ctl-install delivery_module"
        code_block: |
          logosctl package download delivery_module --version <pinned> -o packages
          logosctl package install --file packages/delivery_module-*.lgx -y
        expect_contains:
          - "sha256 OK"
          - '"installed":['
      - title: "Install the metrics scraper too"
        platform: [linux, macos]
        text: |
          `openmetrics` serves the `/metrics` endpoint later in this doc-test.
          It publishes no Windows build.
        run: '"$RELEASE_SET_DIR/doctests/release-set.sh" ctl-install openmetrics'
        code_block: |
          logosctl package download openmetrics --version <pinned> -o packages
          logosctl package install --file packages/openmetrics-*.lgx -y
        expect_contains:
          - "sha256 OK"
          - '"installed":['

  - title: "Build a probe module with the pinned module-builder"
    step: true
    platform: [linux, macos]
    text: |
      The probe is built **before** the node starts, because it needs to be
      subscribed when `nodeStarted` fires. It declares `delivery_module` as a
      dependency and supplies the contract itself via `dependency_overrides`, so
      it compiles against the interface without building `delivery_module` from
      source — what it talks to at runtime is the downloaded `.lgx`.
    steps:
      - title: "Write the dependency contract"
        file:
          path: probe/deps/delivery_module.lidl
          content: |
            ; The subset of delivery_module this probe uses, supplied as a
            ; dependency_override so the probe never builds delivery_module itself.
            module delivery_module {
              method getNodeInfo(nodeInfoId: tstr) -> result

              event nodeStarted(success: bool, message: tstr, timestamp: int)
            }

      - title: "Declare the module"
        file:
          path: probe/metadata.json
          language: json
          content: |
            {
              "name": "probe_delivery",
              "display_name": "Delivery Probe",
              "version": "1.0.0",
              "type": "core",
              "interface": "universal",
              "category": "test",
              "description": "Calls delivery_module and latches its nodeStarted event.",
              "main": "probe_delivery_plugin",
              "dependencies": ["delivery_module"],
              "dependency_overrides": {
                "delivery_module": { "file": "deps/delivery_module.lidl" }
              },
              "nix": {
                "packages": { "build": [], "runtime": [] },
                "external_libraries": [],
                "cmake": {
                  "find_packages": [],
                  "extra_sources": [],
                  "extra_include_dirs": [],
                  "extra_link_libraries": []
                }
              }
            }

      - title: "Pin the builder to the release set"
        run: |
          TAG="$("$RELEASE_SET_DIR/doctests/release-set.sh" pin devUtils logos-module-builder)"
          cat > probe/flake.nix <<EOF
          {
            description = "delivery_module probe";
            inputs = {
              logos-module-builder.url = "github:logos-co/logos-module-builder/$TAG";
            };
            outputs = inputs@{ logos-module-builder, ... }:
              logos-module-builder.lib.mkLogosModule {
                src = ./.;
                configFile = ./metadata.json;
                flakeInputs = inputs;
              };
          }
          EOF
          cat probe/flake.nix
        code_block: |
          inputs = {
            logos-module-builder.url = "github:logos-co/logos-module-builder/<pinned tag>";
          };
        check_file: "probe/flake.nix"

      - title: "Write the build file"
        file:
          path: probe/CMakeLists.txt
          language: cmake
          content: |
            cmake_minimum_required(VERSION 3.14)
            project(ProbeDeliveryPlugin LANGUAGES CXX)

            if(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})
                include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)
            else()
                message(FATAL_ERROR "LogosModule.cmake not found")
            endif()

            file(READ "${CMAKE_CURRENT_SOURCE_DIR}/metadata.json" METADATA_JSON)
            string(JSON MODULE_NAME GET ${METADATA_JSON} name)

            logos_module(
                NAME ${MODULE_NAME}
                SOURCES
                    src/probe_delivery_impl.h
                    src/probe_delivery_impl.cpp
            )

      - title: "Write the probe"
        file:
          path: probe/src/probe_delivery_impl.h
          language: cpp
          content: |
            #pragma once

            #include <string>
            #include "logos_module_context.h"

            /// Probes the delivery_module pinned by the release set. Subscribes
            /// to nodeStarted before the node comes up, so the event assertion
            /// does not depend on the node finding peers.
            class ProbeDeliveryImpl : public LogosModuleContext
            {
            public:
                /// Subscribes to delivery_module's nodeStarted event.
                std::string subscribe();

                /// Description of the last nodeStarted event, or "" if none yet.
                std::string lastNodeStarted();

                /// Round-trips a call into delivery_module and returns what it said.
                std::string nodeInfo(const std::string& what);

            private:
                std::string m_lastNodeStarted;
            };

      - title: "Write the implementation"
        file:
          path: probe/src/probe_delivery_impl.cpp
          language: cpp
          content: |
            #include "probe_delivery_impl.h"

            // modules() needs the generated aggregate to be a complete type, so
            // the cross-module calls live here rather than in the header.
            #include "logos_sdk.h"

            std::string ProbeDeliveryImpl::subscribe()
            {
                const bool ok = modules().delivery_module.onNodeStarted(
                    [this](bool success, const std::string& message, int64_t timestamp) {
                        m_lastNodeStarted = std::string("success=") +
                            (success ? "true" : "false") +
                            " message=" + message +
                            " timestamp=" + std::to_string(timestamp);
                    });
                return ok ? "ok" : "failed";
            }

            std::string ProbeDeliveryImpl::lastNodeStarted()
            {
                return m_lastNodeStarted;
            }

            std::string ProbeDeliveryImpl::nodeInfo(const std::string& what)
            {
                auto result = modules().delivery_module.getNodeInfo(what);
                // Self-describing so the doc-test can assert the call actually
                // succeeded rather than that something was printed.
                return result.success ? ("probe-call-ok " + result.value.dump())
                                      : ("probe-call-failed " + result.error);
            }

      - title: "Build it as a portable package"
        text: |
          `#lgx-portable`, not `#lgx`. The host is a released (portable) AppImage
          and the delivery module came from the catalog as a portable variant; a
          dev build would RPATH into `/nix/store` and refuse to load beside them.
          Nix only sees files git knows about, so the probe is committed first.
          The link is named after the target CI cross-builds for Windows, so
          the next step reads the same path on every platform.
        run: |
          cd probe
          git init -q . && git add -A
          nix build '.#lgx-portable' --no-write-lock-file -o ../probe-delivery
          ls ../probe-delivery/*.lgx
        code_block: |
          git init && git add -A
          nix build '.#lgx-portable' -o ../probe-delivery
        check_file: "probe-delivery"

      - title: "Install the probe"
        platform: [linux, macos, windows]
        text: |
          A path ending in `.lgx` is read as a file, so this never touches the
          catalog. The probe is unsigned and installs anyway: the session's
          `signature_policy` defaults to `warn`.

          On Windows, `probe-delivery/` holds the probe CI cross-built with the
          same pinned builder from `doctests/probes/delivery`: the files above,
          which `scripts/check-probes.py` keeps identical to this spec.
        run: "./bin/logosctl --config-dir ./session package install --file probe-delivery/*.lgx -y"
        code_block: "logosctl package install --file probe-delivery/*.lgx -y"
        expect_contains:
          - '"installed":['

  - title: "Load the modules and subscribe"
    step: true
    text: |
      Everything installed into the running daemon, which re-scanned each time.
      Load both modules, then register the probe's subscription — before any
      lifecycle call, so nothing is missed.
    steps:
      - title: "Load delivery_module"
        run: "./bin/logosctl --config-dir ./session module load delivery_module"
        code_block: "logosctl module load delivery_module"
        expect_contains:
          - "delivery_module"
      - title: "Load the probe"
        run: "./bin/logosctl --config-dir ./session module load probe_delivery"
        code_block: "logosctl module load probe_delivery"
        expect_contains:
          - "probe_delivery"
      - title: "Subscribe"
        run: "./bin/logosctl --config-dir ./session call probe_delivery subscribe"
        code_block: "logosctl call probe_delivery subscribe"
        expect_contains:
          # The value, not the envelope: logosctl wraps every successful call
          # in {"status":"ok",...}, so asserting a bare "ok" would pass even
          # when the subscription failed to register.
          - '"result":"ok"'

  - title: "Initialize the node"
    step: true
    text: |
      The [Run a Logos node](https://docs.logos.co/run-a-node) guide's delivery
      step: a kernel-only node, which is what a node operator runs. The
      `logos.test` preset supplies the network's bootstrap settings. A kernel
      node relays, but has no messaging client, so `send`, `subscribe` and the
      `channel*` calls are unavailable while `getNodeInfo` keeps working.

      The guide's `"nat": "extip:<public-ip>"` is dropped: a CI runner has no
      public IP, and outbound-only is enough to bring the node up.
    steps:
      - title: "Write the node config"
        file:
          path: delivery-config.json
          language: json
          content: |
            {
              "entryLayer": "kernel",
              "kernelConf": {
                "preset": "logos.test",
                "relay": true,
                "logLevel": "INFO",
                "tcpPort": 30303,
                "discv5UdpPort": 9000,
                "discv5Discovery": true
              }
            }
      - title: "createNode"
        run: "./bin/logosctl --config-dir ./session call delivery_module createNode @delivery-config.json"
        code_block: "logosctl call delivery_module createNode @delivery-config.json"
        expect_contains:
          - '"success":true'
      - title: "start"
        run: "./bin/logosctl --config-dir ./session call delivery_module start"
        code_block: "logosctl call delivery_module start"
        expect_contains:
          - '"success":true'
      - title: "Verify the node is up"
        run: |
          ./bin/logosctl --config-dir ./session call delivery_module getAvailableNodeInfoIDs
          ./bin/logosctl --config-dir ./session call delivery_module getNodeInfo Version
          ./bin/logosctl --config-dir ./session call delivery_module getNodeInfo MyBoundPorts
        code_block: |
          logosctl call delivery_module getAvailableNodeInfoIDs
          logosctl call delivery_module getNodeInfo Version
          logosctl call delivery_module getNodeInfo MyBoundPorts
        expect_contains:
          # The success flag, not the mere presence of a result envelope — a
          # module answering success:false also prints a "result", which is
          # exactly how this step passed against a node that had failed to start.
          - '"success":true'

  - title: "Read the results back through the probe"
    step: true
    text: |
      Both halves of the contract, observed from inside the runtime: a call the
      probe made into `delivery_module`, and an event `delivery_module` pushed
      to the probe.
    steps:
      - title: "The probe's own call"
        run: "./bin/logosctl --config-dir ./session call probe_delivery nodeInfo Version"
        code_block: "logosctl call probe_delivery nodeInfo Version"
        expect_contains:
          - "probe-call-ok"
      - title: "The event the probe caught"
        text: |
          `start` returns as soon as the node accepts the call; `nodeStarted` is
          emitted later, by the completion callback. How much later depends on
          the runner, so this polls for the latched event instead of sleeping a
          fixed interval and hoping — a three-second sleep was enough on some
          runs and not others, which is the definition of a flaky test.
        run: |
          out=""
          for i in $(seq 1 30); do
            out="$(./bin/logosctl --config-dir ./session call probe_delivery lastNodeStarted 2>&1)"
            case "$out" in *'"result":"success=true'*) break ;; esac
            sleep 2
          done
          printf '%s\n' "$out"
        code_block: "logosctl call probe_delivery lastNodeStarted"
        expect_contains:
          # Not just "an event arrived" — the event the node emitted on a
          # successful start. An empty latch or a failed start both still fail
          # here, after the full 60s the loop allows.
          - "success=true message="
        post_text: |
          That event was emitted by the pinned `delivery_module` as its node
          finished starting, delivered over the runtime's event channel, and
          captured by a module built with the pinned `logos-module-builder`.

  - title: "Expose the metrics endpoint"
    step: true
    platform: [linux, macos]
    text: |
      `/metrics` is served by the **`openmetrics`** module itself: it runs an HTTP
      server (libmicrohttpd) and, on every scrape, calls the metrics convention
      method on each module named in its config, merging the results into one
      OpenMetrics document with a `module="<name>"` label injected per series.

      `delivery_module` is the *other* kind of source: it already speaks
      OpenMetrics and returns a rendered document from
      `collectOpenMetricsText()`, which the scraper parses back and merges. That
      convention is selected per module with `"format": "text"` — naming it as a
      bare string would call the structured `collectMetrics()` it does not
      implement.
    steps:
      - title: "Load the scraper"
        run: "./bin/logosctl --config-dir ./session module load openmetrics"
        code_block: "logosctl module load openmetrics"
        expect_contains:
          - "openmetrics"
      - title: "Point it at the delivery module"
        file:
          path: openmetrics.json
          language: json
          content: |
            {
              "port": 9465,
              "modules": [
                { "name": "delivery_module", "format": "text" }
              ]
            }
      - title: "Start the server"
        run: "./bin/logosctl --config-dir ./session call openmetrics start @openmetrics.json"
        code_block: "logosctl call openmetrics start @openmetrics.json"
        expect_contains:
          - '"result":1'
      - title: "Confirm it is serving"
        run: "./bin/logosctl --config-dir ./session call openmetrics getInfo"
        code_block: "logosctl call openmetrics getInfo"
        expect_contains:
          - '\"running\":true'
      - title: "Scrape /metrics"
        text: |
          One HTTP request drives a live collection call into `delivery_module`
          from the server thread; the text it returns is parsed and re-rendered
          with a `module="delivery_module"` label on every series.
        run: "curl -s --max-time 30 http://127.0.0.1:9465/metrics"
        code_block: "curl http://127.0.0.1:9465/metrics"
        expect_contains:
          - 'module="delivery_module"'
          - "# EOF"
      - title: "Stop the server"
        run: "./bin/logosctl --config-dir ./session call openmetrics stop"
        code_block: "logosctl call openmetrics stop"
        expect_contains:
          - '"result":1'

  - title: "Shut down"
    step: true
    text: "Stop the daemon and confirm it exited cleanly."
    steps:
      - title: "Stop"
        run: |
          trap '' TERM
          ./bin/logosctl --config-dir ./session daemon stop || true
          true
      - run: "sleep 2"
      - title: "Confirm"
        run: "./bin/logosctl --config-dir ./session daemon status || true"
        code_block: "logosctl daemon status"
        expect_contains:
          - '"status":"not_running"'
