ow to observe a module's events with `logosctl watch`\n- How to build a probe module that calls a dependency and subscribes to its events\n- Which module serves `/metrics`, and how it scrapes others over IPC\n\n## Prerequisites\n\n- **A Linux or macOS machine** (linux-x86_64, linux-arm64 or macos-arm64).\n- **Nix** with flakes enabled \u2014 used only to build the probe module; the tool and modules under test come from released binaries.\n- **`RELEASE_SET_DIR`** pointing at the `logos-release-set` checkout, and **`GITHUB_TOKEN`** set (resolving the set hits the GitHub API)."}, {"execs": [], "md": "## Step 1: Resolve the release set\n\n`release-set.json` carries the minimum a human types \u2014 a tag per app, a\nversion per catalog package. The resolver turns that into\n`release-set.lock.json`: repository URL, commit hash, download URL and\nchecksum for every artifact. Every later step reads the lock, so the whole\ndoc-test is pinned to one immutable set."}, {"execs": [{"cmd": "\"$RELEASE_SET_DIR/doctests/release-set.sh\" lock", "exit_code": 0, "kind": "run", "note": "", "output": "==> reusing pre-resolved /Users/runner/work/logos-release-set/logos-release-set/release-set.lock.json\nrelease set 0.3.0-r.1+c00a807  (logos-co/logos-modules-release)\n  logos-basecamp               0.3.1        aeb819216c\n  logos-logoscore-cli          0.3.1        a3d7507081\n  logos-package-manager        0.3.0        3133786ea8\n  logos-module-builder         0.3.2        4b7998272c\n  blockchain_module            0.3.0        7952ba0cc9\n  chat_module                  0.3.0        5053dd5062\n  delivery_module              0.3.0        bec859430d\n  lez_core                     0.5.0        b89e5d24df\n  lez_indexer_module           1.2.0        b27f3ee7a6\n  liblogos_lez_rln_module      4.2.1        eb02da8f0c\n  liblogos_rln_module          0.10.0       eb02da8f0c\n  libp2p_module                1.1.0        49f77430fb\n  openmetrics                  0.1.1        f8da2a025c\n  stor on\":\"0.5.0\",\"name\":\"package_downloader\",\"source\":\"\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Plugin manager for the Logos system\",\"displayName\":\"Package Manager\",\"hashes\":{\"root\":\"7513eefb546601e0b26fa5ae91f535e091266eeac2e455b83eeb27f25e156892\"},\"icon\":\"\",\"installDir\":\"/private/tmp/doctest-test-tpqjmpbe/.fetch/logos-logoscore-cli/logosctl-aarch64-macos/modules-pkg/package_manager\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"/private/tmp/doctest-test-tpqjmpbe/.fetch/logos-logoscore-cli/logosctl-aarch64-macos/modules-pkg/package_manager/package_manager_plugin.dylib\",\"manifestVersion\":\"0.5.0\",\"name\":\"package_manager\",\"source\":\"\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"protocol\",\"dependencies\":[],\"description\":\"Storage module\",\"displayName\":\"Storage Module\",\"hashes\":{\"root\":\"167ad21b8f3cc1b43f64df0ac5970c4583ad5e7efc3266eb6323415d32d318b4\"},\"icon\":\"\",\"installDir\":\"/private/tmp/doctest-test-tpqjmpbe/./session/modules/storage_module\",\"installType\":\"user\",\"license\":\"\",\"mainFilePath\":\"/private/tmp/doctest-test-tpqjmpbe/./session/modules/storage_module/storage_module_plugin.dylib\",\"manifestVersion\":\"0.6.0\",\"name\":\"storage_module\",\"source\":\"\",\"type\":\"core\",\"version\":\"3.0.0\",\"view\":\"\"}]\n", "status": "pass"}], "md": "### 4.3 Confirm what landed\n\n`SOURCE` separates what this session installed (`user`) from the\nmodules shipped read-only beside the binary (`embedded`) \u2014 which is\nwhere `capability_module`, the auth handshake every load needs, comes\nfrom. Nothing had to be seeded by hand.\n\n```bash\nlogosctl package ls\n```"}, {"execs": [], "md": "## Step 5: Build a probe module with the pinned module-builder\n\nCalling a module from the CLI proves it answers. It does not prove that\n*another module* can consume it \u2014 the path every real application uses.\nSo we build one, with the `logos-module-builder` release this set pins.\n\nThe probe declares `storage_module` as a dependency and supplies the\ncontract itself via `dependency_overrides`. That matters: a contract file\nmeans the probe compiles against the *interface* without building\n`storage_module` from source, so what it talks to at runtime is the\ndownloaded `.lgx` and nothing else. (This is the same mechanism\n`logos-chat-module` uses for its `delivery_module` dependency.)"}, {"execs": [{"cmd": "mkdir -p probe/src probe/deps\nVER=\"$(\"$RELEASE_SET_DIR/doctests/release-set.sh\" pin modules storage_module)\"\ncat > probe/deps/storage_module.lidl <<EOF\n; The subset of storage_module this probe uses, supplied as a\n; dependency_override so the probe never builds storage_module itself.\nmodule storage_module {\n  version \"$VER\"\n\n  method moduleVersion() -> tstr\n  method uploadUrl(filePath: tstr, chunkSize: int, advertise: bool) -> result\n\n  event storageUploadDone(payload: tstr)\n}\nEOF\ncat probe/deps/storage_module.lidl\n", "exit_code": 0, "kind": "run", "note": "", "output": "; The subset of storage_module this probe uses, supplied as a\n; dependency_override so the probe never builds storage_module itself.\nmodule storage_module {\n  version \"3.0.0\"\n\n  method moduleVersion() -> tstr\n  method uploadUrl(filePath: tstr, chunkSize: int, advertise: bool) -> result\n\n  event storageUploadDone(payload: tstr)\n}\n", "status": "pass"}], "md": "### 5.1 Write the dependency contract\n\nOnly the subset the probe uses, pinned to the version in the release\nset. `logos-lidl` turns this into a typed client for the probe.\n\n```bash\nmodule storage_module {\n  version \"<pinned>\"\n\n  method moduleVersion() -> tstr\n  method uploadUrl(filePath: tstr, chunkSize: int, advertise: bool) -> result\n\n  event storageUploadDone(payload: tstr)\n}\n```"}, {"execs": [{"cmd": "write probe/metadata.json", "kind": "file", "note": "Wrote probe/metadata.json", "status": "pass"}], "md": "### 5.2 Declare the module\n\n```json\n{\n  \"name\": \"probe_storage\",\n  \"display_name\": \"Storage Probe\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"interface\": \"universal\",\n  \"category\": \"test\",\n  \"description\": \"Calls storage_module and latches one of its events.\",\n  \"main\": \"probe_storage_plugin\",\n  \"dependencies\": [\"storage_module\"],\n  \"dependency_overrides\": {\n    \"storage_module\": { \"file\": \"deps/storage_module.lidl\" }\n  },\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [],\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_sources\": [],\n      \"extra_include_dirs\": [],\n      \"extra_link_libraries\": []\n    }\n  }\n}\n```"}, {"execs": [{"cmd": "TAG=\"$(\"$RELEASE_SET_DIR/doctests/release-set.sh\" pin devUtils logos-module-builder)\"\ncat > probe/flake.nix <<EOF\n{\n  description = \"storage_module probe\";\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder/$TAG\";\n  };\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\nEOF\ncat probe/flake.nix\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\n  description = \"storage_module probe\";\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder/0.3.2\";\n  };\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\n", "status": "pass"}], "md": "### 5.3 Pin the builder to the release set\n\nThe one input that matters: `logos-module-builder` at the tag the\nrelease set pins. That is what \"built with the dev utils this release\nset ships\" means concretely.\n\n```bash\ninputs = {\n  logos-module-builder.url = \"github:logos-co/logos-module-builder/<pinned tag>\";\n};\n```"}, {"execs": [{"cmd": "write probe/CMakeLists.txt", "kind": "file", "note": "Wrote probe/CMakeLists.txt", "status": "pass"}], "md": "### 5.4 Write the build file\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(ProbeStoragePlugin LANGUAGES CXX)\n\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found\")\nendif()\n\nfile(READ \"${CMAKE_CURRENT_SOURCE_DIR}/metadata.json\" METADATA_JSON)\nstring(JSON MODULE_NAME GET ${METADATA_JSON} name)\n\nlogos_module(\n    NAME ${MODULE_NAME}\n    SOURCES\n        src/probe_storage_impl.h\n        src/probe_storage_impl.cpp\n)\n```"}, {"execs": [{"cmd": "write probe/src/probe_storage_impl.h", "kind": "file", "note": "Wrote probe/src/probe_storage_impl.h", "status": "pass"}], "md": "### 5.5 Write the probe\n\nA universal module: you write the implementation class, and the Qt\nplugin glue is generated from this header. Module code stays Qt-free \u2014\n`std::string`, not `QString`.\n\n```cpp\n#pragma once\n\n#include <string>\n#include \"logos_module_context.h\"\n\n/// Probes the storage_module pinned by the release set: one call in,\n/// one event out. Deriving LogosModuleContext gives us modules() \u2014\n/// typed callers and typed event subscriptions for everything in\n/// metadata.json#dependencies.\nclass ProbeStorageImpl : public LogosModuleContext\n{\npublic:\n    /// Subscribes to storage_module's storageUploadDone event.\n    /// Returns \"ok\" once the subscription is registered.\n    std::string subscribe();\n\n    /// The payload of the last storageUploadDone we received.\n    /// Empty until one arrives.\n    std::string lastUploadEvent();\n\n    /// Round-trips a call into storage_module. Returns a\n    /// self-describing string so the doc-test can assert the call\n    /// actually succeeded rather than that something was printed.\n    std::string targetVersion();\n\nprivate:\n    std::string m_lastUpload;\n};\n```"}, {"execs": [{"cmd": "write probe/src/probe_storage_impl.cpp", "kind": "file", "note": "Wrote probe/src/probe_storage_impl.cpp", "status": "pass"}], "md": "### 5.6 Write the implementation\n\n```cpp\n#include \"probe_storage_impl.h\"\n\n// modules() needs the generated aggregate to be a complete type, so\n// the cross-module calls live here rather than in the header.\n#include \"logos_sdk.h\"\n\nstd::string ProbeStorageImpl::subscribe()\n{\n    const bool ok = modules().storage_module.onStorageUploadDone(\n        [this](const std::string& payload) { m_lastUpload = payload; });\n    return ok ? \"ok\" : \"failed\";\n}\n\nstd::string ProbeStorageImpl::lastUploadEvent()\n{\n    return m_lastUpload;\n}\n\nstd::string ProbeStorageImpl::targetVersion()\n{\n    const std::string version = modules().storage_module.moduleVersion();\n    return version.empty() ? \"probe-call-failed: empty version\"\n                           : \"probe-call-ok version=\" + version;\n}\n```"}, {"execs": [{"cmd": "cd probe\ngit init -q . && git add -A\nnix build '.#lgx-portable' --no-write-lock-file -o probe-lgx\nls probe-lgx/*.lgx\n", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/private/tmp/doctest-test-tpqjmpbe/probe' is dirty\nunpacking 'github:logos-co/logos-module-builder/4b7998272c5ec014bcac4bf1c7dbe7602c63a3c1' into the Git cache...\ncopying path '/nix/store/8sa9pwyzb94syjjd4vl9s618sam4g8q2-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/a30408ybri874zphhix5mrcv6x6jq46y-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/7iigyw9jzka7qz4p9rvv553agg4s8nzz-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/5r25nmlbzs9l9xcr1ldlwipqvccqwzqw-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/2qaxzad3g8w3zkw2ar e/207fn5n68di6vwv3rw3nxy0r7rmyqcyn-logos-probe_storage-module-lib-1.0.0.drv'...\nbuilding '/nix/store/lfbr5cdvwlavczfbc33a6jdylv1qd2s2-closure-info.drv'...\nbuilding '/nix/store/h0hmc2v9sc6nrn84kjcw6yhsq7iw9nsi-logos-probe_storage-module-lib-bundle-1.0.0.drv'...\nbuilding '/nix/store/yr28z0w0iyjgp6ia0a5fxck4dza52zz1-logos-probe_storage-module-lib-lgx-1.0.0.drv'...\nprobe-lgx/logos-probe_storage-module-lib.lgx\n", "status": "pass"}], "md": "### 5.7 Build it as a portable package\n\n`#lgx-portable`, not `#lgx`. The host is a released (portable)\n`logosctl` and the storage module came from the catalog as a portable\nvariant; a dev build would RPATH into `/nix/store` and refuse to load\nbeside them.\nNix only sees files git knows about, so the probe is committed first.\n\n```bash\ngit init && git add -A\nnix build '.#lgx-portable' -o probe-lgx\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session package install --file probe/probe-lgx/*.lgx -y", "exit_code": 0, "kind": "run", "note": "", "output": "{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"/private/tmp/doctest-test-tpqjmpbe/probe/probe-lgx/logos-probe_storage-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"probe_storage\",\"signature\":\"unsigned\",\"toVersion\":\"1.0.0\"}],\"installed\":[\"probe_storage\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.8 Install the probe\n\nA path ending in `.lgx` is read as a file, so this never touches the\ncatalog. The probe is unsigned and installs anyway: the session's\n`signature_policy` defaults to `warn`, which is what a locally built\nmodule needs.\n\n```bash\nlogosctl package install --file probe/probe-lgx/*.lgx -y\n```"}, {"execs": [], "md": "## Step 6: Load the module\n\nEverything installed while the daemon was already running, and it\nre-scanned each time, so there is nothing to restart \u2014 the modules are\nvisible to it now. Installing is not loading, though: `package install`\nputs files on disk, `module load` starts them."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"name\":\"openmetrics\",\"status\":\"not_loaded\",\"version\":\"0.1.1\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":155,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":155,\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":155,\"version\":\"0.1.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":139,\"version\":\"3.0.0\"},{\"name\":\"probe_storage\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":155,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 6.1 List what the daemon can see\n\n```bash\nlogosctl module ls\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load storage_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"storage_module\",\"status\":\"ok\",\"version\":\"3.0.0\"}\n", "status": "pass"}], "md": "### 6.2 Load it\n\nDependencies come with it, always \u2014 there is no opt-out.\n\n```bash\nlogosctl module load storage_module\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":2297,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"openmetrics\",\"status\":\"not_loaded\",\"version\":\"0.1.1\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":155,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":155,\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":155,\"version\":\"0.1.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":139,\"version\":\"3.0.0\"},{\"name\":\"probe_storage\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":155,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":5,\"not_loaded\":2}}\n", "status": "pass"}], "md": "### 6.3 Confirm it is loaded\n\n```bash\nlogosctl daemon status\n```"}, {"execs": [], "md": "## Step 7: Wait for the storage node\n\nTestnet v0.3 changed how a storage node comes up. The package downloader\nfetches packages through `storage_module`, so it starts the node itself,\nwith its saved configuration or the defaults on first use; as the\n[Run a Logos node](https://docs.logos.co/run-a-node) guide says, there is\nnothing to `init` or `start`. Installing the pinned package reloaded the\nmodule and the downloader started it again, so the node that comes up is\nthe pinned one."}, {"execs": [{"cmd": "out=\"\"\nfor i in $(seq 1 90); do\n  out=\"$(./bin/logosctl --config-dir ./session call storage_module isRunning 2>&1)\"\n  case \"$out\" in *'\"result\":true'*) break ;; esac\n  sleep 2\ndone\nprintf '%s\\n' \"$out\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"isRunning\",\"module\":\"storage_module\",\"result\":true,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.1 Wait until it is running\n\nStartup can take a few minutes.\n\n```bash\nlogosctl call storage_module isRunning\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call storage_module debug", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"debug\",\"module\":\"storage_module\",\"result\":{\"error\":null,\"success\":true,\"value\":{\"addrs\":[\"/ip4/34.123.182.254/tcp/8070/p2p/16Uiu2HAm17wqb6L3gNU1n2jNTbQGXXYS6wqm9QbHCtoWCypN9NEM/p2p-circuit\",\"/ip4/34.123.182.254/tcp/8070/mix-transport/AlSbmSoZT3knJOqgs5Yj0sRMdqsKFXfQzCToeCy-lDFqbF-MKuV_t9DxFFCJOMz_jpm5K6GjhNNYQHblKnvOVQQ=/p2p/16Uiu2HAm17wqb6L3gNU1n2jNTbQGXXYS6wqm9QbHCtoWCypN9NEM/p2p-circuit\",\"/ip4/47 Seen\":1790909860,\"peerId\":\"16Uiu2HAm6qxZCECWGCjZKXnN1Qmw37Yxv9ZzTHyKXi7e5NaMiiKD\"}]}}},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.2 Inspect it\n\n`debug` reports the node's peer ID (`id`) and its signed peer record (`spr`).\n\n```bash\nlogosctl call storage_module debug | jq .result.value.id\n```"}, {"execs": [], "md": "## Step 8: Drive storage_module through the probe\n\nThe daemon is already running with the storage node started, so loading the\nprobe wires it to the live module. Everything below crosses a real\ninter-module boundary."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load probe_storage", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"probe_storage\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 8.1 Load the probe\n\n```bash\nlogosctl module load probe_storage\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_storage targetVersion", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"targetVersion\",\"module\":\"probe_storage\",\"result\":\"probe-call-ok version=3.0.0\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.2 Call storage_module from the probe\n\nA cross-module call: probe -> storage_module -> back.\n\n```bash\nlogosctl call probe_storage targetVersion\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_storage subscribe", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"subscribe\",\"module\":\"probe_storage\",\"result\":\"ok\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.3 Subscribe to the event\n\n```bash\nlogosctl call probe_storage subscribe\n```"}, {"execs": [{"cmd": "sh -c './bin/logosctl --config-dir ./session watch storage_module --event storageUploadDone --json > upload-event.txt 2>&1 & echo $! > watch.pid'", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 8.4 Watch for the upload event\n\n```bash\nlogosctl watch storage_module --event storageUploadDone --json\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "echo \"hello from the release set\" > hello.txt\n./bin/logosctl --config-dir ./session call storage_module uploadUrl \"$(pwd)/hello.txt\" 65536 true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"uploadUrl\",\"module\":\"storage_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"0\"},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.5 Trigger an upload\n\nUploading a file makes `storage_module` emit `storageUploadDone`. The\nprobe is subscribed, so the payload lands in its state. The third\nargument, `advertise`, announces the new content to the network.\n\n```bash\nlogosctl call storage_module uploadUrl \"$(pwd)/hello.txt\" 65536 true\n```"}, {"execs": [{"cmd": "for i in $(seq 1 30); do grep -q cid upload-event.txt && break; sleep 1; done\nkill \"$(cat watch.pid)\" 2>/dev/null || true\ncat upload-event.txt\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"data\":{\"arg0\":\"{\\\"cid\\\":\\\"zDvZRwzm5oWpet4a5qfodHwCmCbHpRACbkz4372Yaxbz8UnX2NiF\\\",\\\"sessionId\\\":\\\"0\\\",\\\"success\\\":true}\"},\"event\":\"storageUploadDone\",\"module\":\"storage_module\",\"timestamp\":\"2026-10-02T02:59:11Z\"}\n", "status": "pass"}], "md": "### 8.6 Confirm the event arrived\n\n```bash\ncat upload-event.txt\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_storage lastUploadEvent", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"lastUploadEvent\",\"module\":\"probe_storage\",\"result\":\"{\\\"cid\\\":\\\"zDvZRwzm5oWpet4a5qfodHwCmCbHpRACbkz4372Yaxbz8UnX2NiF\\\",\\\"sessionId\\\":\\\"0\\\",\\\"success\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.7 Read the event back out of the probe\n\n```bash\nlogosctl call probe_storage lastUploadEvent\n```\n\nThat payload was produced by the pinned `storage_module`, delivered\nacross the runtime's event channel, and captured by a module built with\nthe pinned `logos-module-builder`. Calls and events both work in the set\nas pinned."}, {"execs": [], "md": "## Step 9: Expose the metrics endpoint\n\n`/metrics` is served by the **`openmetrics`** module itself: it runs an HTTP\nserver (libmicrohttpd) and, on every scrape, calls the metrics convention\nmethod on each module named in its config, merging the results into one\nOpenMetrics document with a `module=\"<name>\"` label injected per series.\n\n`storage_module` implements the structured `collectMetrics()` convention,\nso it is named as a bare string. (A module that already renders\nOpenMetrics text implements `collectOpenMetricsText()` instead and is named\nas `{\"name\": \"...\", \"format\": \"text\"}`.)"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load openmetrics", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"openmetrics\",\"status\":\"ok\",\"version\":\"0.1.1\"}\n", "status": "pass"}], "md": "### 9.1 Load the scraper\n\n```bash\nlogosctl module load openmetrics\n```"}, {"execs": [{"cmd": "write openmetrics.json", "kind": "file", "note": "Wrote openmetrics.json", "status": "pass"}], "md": "### 9.2 Point it at the storage module\n\n```json\n{\n  \"port\": 9464,\n  \"modules\": [\"storage_module\"]\n}\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call openmetrics start @openmetrics.json", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"start\",\"module\":\"openmetrics\",\"result\":1,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 9.3 Start the server\n\n```bash\nlogosctl call openmetrics start @openmetrics.json\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call openmetrics getInfo", "exit_code": 0, "kind": "run", "note": "", "output": "{\"me   const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
