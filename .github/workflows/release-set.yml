name: Validate and publish release set

# Names each dispatch in the run list by the branch it validated, so a history
# of runs reads as a history of release sets rather than five identical rows.
run-name: "Release set from ${{ github.ref_name }}"

# Manual only. `main` holds CHANGE-ME placeholders and is expected to fail the
# pin check immediately; run this from a release branch with the versions
# filled in.
#
#   1. resolve   — every pin -> repo url, commit, tag, download url, checksum,
#                  CI run. Produces release-set.lock.json.
#   2. doctests  — the release set validated on linux-x86_64, linux-arm64 and
#                  macOS arm64, using only released binaries and catalog
#                  packages. Specs whose artifacts are missing for a platform
#                  are skipped, not failed.
#      tutorial  — logos-tutorial's specs at the pinned commit, built against
#                  the versions this release set pins.
#   3. publish   — on green, a GitHub release with the lock, the reports, and
#                  a description linking every artifact.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve and validate, but do not publish a release"
        type: boolean
        default: false
      specs:
        description: "Space-separated spec names to run (default: all that apply)"
        type: string
        default: ""

concurrency:
  group: release-set-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve the release set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tutorial_matrix: ${{ steps.tutorial.outputs.matrix }}
      tutorial_any: ${{ steps.tutorial.outputs.any }}
      tutorial_repo: ${{ steps.tutorial.outputs.repo }}
      tutorial_commit: ${{ steps.tutorial.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      # Catches a release-set.json that some script reflowed — the data can be
      # perfectly correct while the diff is unreadable. Cheap, and it fails
      # before anything is downloaded.
      - name: Check release-set.json is canonically formatted
        run: python3 scripts/format-release-set.py --check

      - name: Resolve every pin
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/resolve.py release-set.json -o release-set.lock.json \
            --release-set-commit "$GITHUB_SHA"
          version="$(python3 -c "import json;print(json.load(open('release-set.lock.json'))['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Release set \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise what was resolved
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          lock = json.load(open("release-set.lock.json"))
          print("\n| Component | Pin | Commit |\n|---|---|---|")
          for group in ("apps", "devUtils", "tools"):
              for item in lock[group]:
                  print(f"| {item['name']} | `{item['tag']}` | `{(item['commit'] or '')[:10]}` |")
          for group in ("modules", "uiApps"):
              for item in lock[group]:
                  print(f"| {item['name']} | `{item['version']}` | `{(item['commit'] or '')[:10]}` |")
          gaps = lock.get("platformGaps", [])
          if gaps:
              print("\n**Platform gaps**\n")
              for gap in gaps:
                  print(f"- {gap['reason']}")
          PY

      # Every repo the tutorial builds against was pinned by resolve.py — to
      # this release set's version where it has one. Hand those pins over as a
      # {repo: ref} map the tutorial's own tutorial-set.py applies.
      - name: Plan the tutorial run
        id: tutorial
        run: |
          python3 scripts/tutorial-plan.py release-set.lock.json \
            --override-out tutorial-pins.json \
            --skips-out results-tutorial-skipped.json \
            --format github >> "$GITHUB_OUTPUT"
          { echo; echo "### Tutorial"; echo
            python3 scripts/tutorial-plan.py release-set.lock.json; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-set-lock
          path: |
            release-set.lock.json
            tutorial-pins.json
          if-no-files-found: error

      # Platforms the tutorial does not run on, recorded as skips so the
      # release notes name them.
      - uses: actions/upload-artifact@v4
        with:
          name: results-tutorial-skipped
          path: results-tutorial-skipped.json
          if-no-files-found: error

  # One job per spec per platform, rather than one job that runs all five specs
  # in sequence. The results model was already keyed on (spec, platform), so
  # this only makes the jobs match it — and it buys three things: a failure
  # names itself in the job list instead of hiding inside a 900-line log, the
  # slow spec (basecamp-ui, which builds Qt) stops gating the quick ones, and a
  # single flaky spec can be re-run without repeating the other fourteen.
  doctests:
    name: ${{ matrix.spec }} (${{ matrix.platform.id }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { id: linux-x86_64, runner: ubuntu-latest }
          - { id: linux-arm64,  runner: ubuntu-24.04-arm }
          - { id: macos-arm64,  runner: macos-latest }
        spec:
          - headless-storage-module
          - headless-delivery-module
          - headless-blockchain-module
          - basecamp-appimage-smoke
          - basecamp-ui
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-set-lock

      # Nix plus both Logos Attic caches, read-only (no token): they carry the
      # probe modules' build closure and the inspector-enabled Basecamp bundle.
      # The action holds the caches' current keys; a stale copy here once made
      # every substitution fail silently into a build from source.
      - name: Install Nix
        uses: logos-co/setup-nix-cache-action@v1

      # The portable bundle carries its own Qt but not host graphics drivers —
      # you cannot bundle a GPU driver — so it loads libGL/glvnd from the host
      # exactly as it would on a real desktop. Minimal CI runners have none.
      # Only the Basecamp specs put a Qt GUI on screen. The portable bundle
      # carries its own Qt but not host graphics drivers — you cannot bundle a
      # GPU driver — so it loads libGL/glvnd from the host exactly as it would
      # on a real desktop. Minimal CI runners have none.
      - name: Install graphics runtime libraries
        if: startsWith(matrix.platform.id, 'linux') && startsWith(matrix.spec, 'basecamp')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopengl0 libglx0 libgl1 libegl1 libglu1-mesa libvulkan1

      # Can THIS spec run on THIS platform? A pinned release that publishes no
      # artifact for a platform means skip-and-flag, not fail.
      - name: Decide whether this spec can run here
        id: select
        env:
          SPECS_INPUT: ${{ inputs.specs }}
        run: |
          python3 scripts/select-specs.py release-set.lock.json \
            --platform "${{ matrix.platform.id }}" --only "${{ matrix.spec }}" \
            --format github >> "$GITHUB_OUTPUT"
          # An explicit `specs` input narrows the run; a spec left out of it is
          # not run and must not be reported as passing.
          if [ -n "$SPECS_INPUT" ]; then
            case " $SPECS_INPUT " in
              *" ${{ matrix.spec }} "*) ;;
              *) echo "deselected=true" >> "$GITHUB_OUTPUT"
                 echo "not in the requested spec list — not running" ;;
            esac
          fi
          cat "$GITHUB_OUTPUT"

      - name: Run the doc-test
        id: run
        if: steps.select.outputs.any == 'true' && steps.select.outputs.deselected != 'true'
        env:
          RELEASE_SET_DIR: ${{ github.workspace }}
          RELEASE_SET_LOCK: ${{ github.workspace }}/release-set.lock.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ runner.temp }}/reports"
          nix run github:logos-co/logos-doctest -- run \
            "doctests/${{ matrix.spec }}.test.yaml" \
            --verbose \
            --continue-on-fail \
            --report "${{ runner.temp }}/reports/index.html"

      - name: Record the results
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
          SKIPPED: ${{ steps.select.outputs.skipped }}
          DESELECTED: ${{ steps.select.outputs.deselected }}
          SPEC: ${{ matrix.spec }}
          PLATFORM: ${{ matrix.platform.id }}
          RUNNER_LABEL: ${{ matrix.platform.runner }}
          # Must match where the publish job arranges the reports for gh-pages.
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_id }}
        run: python3 scripts/record-result.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.platform.id }}-${{ matrix.spec }}
          path: results-${{ matrix.platform.id }}-${{ matrix.spec }}.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.platform.id }}-${{ matrix.spec }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn

  # One job per tutorial spec per platform, like the doctests above. The specs
  # and platforms come from the tutorial's tutorial-set.json at the pinned
  # commit, so a tutorial added there is validated here without editing this
  # file.
  tutorial:
    name: ${{ matrix.spec }} (${{ matrix.platform }})
    needs: resolve
    if: needs.resolve.outputs.tutorial_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.tutorial_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.tutorial_repo }}
          ref: ${{ needs.resolve.outputs.tutorial_commit }}
          path: tutorial

      - uses: actions/download-artifact@v4
        with:
          name: release-set-lock

      - name: Install Nix
        uses: logos-co/setup-nix-cache-action@v1

      - name: Decide whether this spec was requested
        id: select
        env:
          SPECS_INPUT: ${{ inputs.specs }}
        run: |
          if [ -n "$SPECS_INPUT" ]; then
            case " $SPECS_INPUT " in
              *" ${{ matrix.spec }} "*) ;;
              *) echo "deselected=true" >> "$GITHUB_OUTPUT"
                 echo "not in the requested spec list — not running" ;;
            esac
          fi

      - name: Run the tutorial
        id: run
        if: steps.select.outputs.deselected != 'true'
        working-directory: tutorial
        run: |
          python3 scripts/tutorial-set.py pins --override ../tutorial-pins.json
          read -r -a pins <<< "$(python3 scripts/tutorial-set.py doctest-args --override ../tutorial-pins.json)"
          mkdir -p "${{ runner.temp }}/reports"
          nix run github:logos-co/logos-doctest -- run \
            "tests/${{ matrix.spec }}.test.yaml" \
            ${pins[@]+"${pins[@]}"} \
            --verbose \
            --continue-on-fail \
            --report "${{ runner.temp }}/reports/index.html"

      - name: Record the results
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
          DESELECTED: ${{ steps.select.outputs.deselected }}
          SPEC: ${{ matrix.spec }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER_LABEL: ${{ matrix.runner }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_id }}
        run: python3 scripts/record-result.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.platform }}-${{ matrix.spec }}
          path: results-${{ matrix.platform }}-${{ matrix.spec }}.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.platform }}-${{ matrix.spec }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn

  publish:
    name: Publish the release set
    needs: [resolve, doctests, tutorial]
    # Only a fully green run publishes. Placeholders on main never get this far
    # — the resolve job fails first. The tutorial job is skipped, not failed,
    # when the release set pins no tutorial.
    if: >-
      ${{ !cancelled() && !inputs.dry_run
          && needs.resolve.result == 'success'
          && needs.doctests.result == 'success'
          && (needs.tutorial.result == 'success' || needs.tutorial.result == 'skipped')
          && github.ref_name != 'main' && github.ref_name != 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The results recorded each report at <run_id>/<platform>/<spec>/.
      # Publishing ./artifacts verbatim would put them at
      # <run_id>/reports-<platform>-<spec>/ instead and every report link in the
      # release description would 404, so lay the site out to match the URLs
      # that were recorded.
      - name: Arrange the reports for publishing
        id: site
        run: |
          found=0
          for dir in artifacts/reports-*; do
            [ -f "$dir/index.html" ] || continue
            # reports-<platform>-<spec>; platforms contain no "-" past their
            # own name, so strip the known platform prefix rather than guess.
            rest="${dir#artifacts/reports-}"
            case "$rest" in
              linux-x86_64-*) platform=linux-x86_64 ;;
              linux-arm64-*)  platform=linux-arm64 ;;
              macos-arm64-*)  platform=macos-arm64 ;;
              *) echo "unrecognised artifact name: $dir" >&2; exit 1 ;;
            esac
            spec="${rest#"$platform"-}"
            mkdir -p "site/$platform/$spec"
            cp "$dir/index.html" "site/$platform/$spec/index.html"
            found=$((found + 1))
          done
          # Travels with the reports so the landing page can name this run by
          # its release version instead of a bare run id.
          cat > site/meta.json <<META
          {
            "version": "${{ needs.resolve.outputs.version }}",
            "runId": "${{ github.run_id }}",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          META
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "Arranged $found report(s)"
          find site -type f | sort

      - name: Publish the doc-test reports
        if: steps.site.outputs.found != '0'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: ${{ github.run_id }}
          keep_files: true
          commit_message: "Release-set reports for ${{ needs.resolve.outputs.version }} (${{ github.sha }})"

      # Without this the site root is empty: the reports only exist under
      # <run_id>/<platform>/<spec>/, which the release notes link into directly
      # but nobody can discover by opening the site. Regenerated from whatever
      # is on gh-pages after the push above, so it covers every run, not just
      # this one.
      - name: Build the reports landing page
        if: steps.site.outputs.found != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/render-pages-index.py \
            --repo "${{ github.repository }}" -o root/index.html
          head -20 root/index.html

      - name: Publish the landing page
        if: steps.site.outputs.found != '0'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./root
          keep_files: true
          commit_message: "Reports index for ${{ needs.resolve.outputs.version }}"

      - name: Merge results and render the release notes
        run: |
          python3 scripts/render-release.py \
            artifacts/release-set-lock/release-set.lock.json \
            artifacts/results-*/results-*.json \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out-lock release-set.lock.json \
            --out-notes RELEASE.md
          cat RELEASE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # Fifteen separate HTML reports would bury the two assets that matter,
          # so they travel as one archive. The per-cell links in the notes point
          # at the browsable copies on gh-pages.
          tar -czf reports.tar.gz -C site .
          ls -la reports.tar.gz
          gh release create "v$VERSION" \
            --title "Logos Release Set $VERSION" \
            --notes-file RELEASE.md \
            --target "${{ github.sha }}" \
            release-set.lock.json reports.tar.gz
