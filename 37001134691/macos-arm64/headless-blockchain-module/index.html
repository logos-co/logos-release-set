<script id="report-data" type="application/json">{"generated_platform": "Darwin", "summary": {"failed": 0, "passed": 31, "skipped": 0}, "tutorials": [{"meta": {"name": "Validating the pinned blockchain_module", "platform": "Darwin (ext=dylib)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Validating the pinned blockchain_module\n\nThis doc-test validates the `blockchain_module` pinned by\n[`release-set.json`](../release-set.json), using only released artifacts:\n`logosctl` \u2014 the runtime and the package manager in one \u2014 downloaded from its\nGitHub release at the pinned tag, and `blockchain_module` pulled from the\nmodule catalog at the pinned version and checksum-verified before install.\n\nInitialization follows the\n[Run a Logos node](https://docs.logos.co/run-a-node) guide for Testnet v0.3 \u2014\nthe real testnet peer set, `generate_user_config`, then `start` \u2014 stopping\nshort of the parts a CI runner cannot do (faucet funding and blend-network\nparticipation both need a public IP and on-chain funds).\n\nA **probe module** built with the pinned `logos-module-builder` then calls the\nmodule and subscribes to its `newBlock` event. Finally the pinned\n**`openmetrics`** module is loaded and `/metrics` scraped over HTTP \u2014\n`blockchain_module` implements neither metrics convention, so the probe\npublishes the block count it observed and the scrape reads that.\n\n> **On `newBlock`:** it only fires once the node has synced blocks from\n> testnet peers, which depends on network conditions a CI run does not\n> control. The subscription *registering* is asserted; the event *arriving* is\n> reported but not asserted, so a slow sync reports honestly instead of\n> failing red. The deterministic assertion is the `get_cryptarchia_info` call.\n\n**What you'll build:** The pinned `blockchain_module`, installed from the catalog, joined to the testnet headlessly, and driven through a purpose-built probe module.\n\n**What you'll learn:**\n\n- How a release set pins tools by release tag and modules by catalog version\n- How to install an exact module version with `logosctl package download --version`\n- How to generate a node config and start a blockchain node headlessly\n- How to query chain state with `get_cryptarchia_info`\n- How to subscribe to a dependency's events from another module\n- Which module serves `/metrics`, and how a module becomes scrapeable\n\n## Prerequisites\n\n- **A Linux or macOS machine** (linux-x86_64, linux-arm64 or macos-arm64).\n- **Nix** with flakes enabled \u2014 used only to build the probe module; the tool and modules under test come from released binaries.\n- **Outbound UDP** to the testnet peers. No inbound ports or public IP are required for this doc-test.\n- **`RELEASE_SET_DIR`** pointing at the `logos-release-set` checkout, and **`GITHUB_TOKEN`** set (resolving the set hits the GitHub API)."}, {"execs": [], "md": "## Step 1: Resolve the release set\n\nThe resolver turns the pinned tags and versions in `release-set.json` into\n`release-set.lock.json` \u2014 repository URL, commit, download URL and checksum\nfor every artifact. Every later step reads the lock."}, {"execs": [{"cmd": "\"$RELEASE_SET_DIR/doctests/release-set.sh\" lock", "exit_code": 0, "kind": "run", "note": "", "output": "==> reusing pre-resolved /Users/runner/work/logos-release-set/logos-release-set/release-set.lock.json\nrelease set 0.3.0-r.1+165d14a  (logos-co/logos-modules-release)\n  logos-basecamp               0.3.1        aeb819216c\n  logos-logoscore-cli          0.3.1        a3d7507081\n  logos-package-manager        0.3.0        3133786ea8\n  logos-module-builder         0.3.2        4b7998272c\n  blockchain_module            0.3.0        7952ba0cc9\n  chat_module                  0.3.0        5053dd5062\n  delivery_module              0.3.0        bec859430d\n  lez_core                     0.5.0        b89e5d24df\n  lez_indexer_module           1.2.0        b27f3ee7a6\n  liblogos_lez_rln_module      4.2.1 ed `package_manager`, which lives inside the running\ndaemon, and the daemon re-scans its module directories after every\ninstall. `capability_module` \u2014 the auth handshake every load needs \u2014 is\nbundled beside the binary too, so nothing has to be seeded by hand."}, {"execs": [{"cmd": "mkdir -p home\nHOME=\"$(pwd)/home\" ./bin/logosctl --config-dir ./session daemon start --detach\n", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon started (pid 2581)\nLogs: /private/tmp/doctest-test-40klej89/./session/logs/daemon.log\n", "status": "pass"}], "md": "### 3.1 Start the daemon\n\n`--detach` is not `&`. Backgrounding returns before the transports\nhave bound; `--detach` returns only once the daemon has published its\nstate file and is answering commands.\nThe daemon gets a `HOME` inside this run's directory. As soon as it\nis up, the package downloader starts the storage node with its default\nconfiguration, which keeps the node's data in `~/.logos_storage`; this\nkeeps a run clear of a real node there, such as Basecamp's.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":2581,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"0.1.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"3.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":5,\"not_loaded\":0}}\n", "status": "pass"}], "md": "### 3.2 Confirm it is up\n\n```bash\nlogosctl daemon status\n```"}, {"execs": ", "status": "pass"}], "md": "### 4.1 Download, verify and install\n\n```bash\nlogosctl package download blockchain_module --version <pinned> -o packages\nlogosctl package install --file packages/blockchain_module-*.lgx -y\n```"}, {"execs": [{"cmd": "\"$RELEASE_SET_DIR/doctests/release-set.sh\" ctl-install openmetrics", "exit_code": 0, "kind": "run", "note": "", "output": "==> logosctl package download openmetrics --version 0.1.1\n    sha256 OK (83bf44a9d346\u2026)\n{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"/private/tmp/doctest-test-40klej89/packages/openmetrics-0.1.1.lgx\",\"fromVersion\":\"\",\"name\":\"openmetrics\",\"signature\":\"unsigned\",\"toVersion\":\"0.1.1\"}],\"installed\":[\"openmetrics\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.2 Install the metrics scraper too\n\n`openmetrics` serves the `/metrics` endpoint later in this doc-test.\n\n```bash\nlogosctl package download openmetrics --version <pinned> -o packages\nlogosctl package install --file packages/openmetrics-*.lgx -y\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session package show blockchain_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"author\":\"Logos Blockchain Team\",\"category\":\"blockchain\",\"dependencies\":[],\"description\":\"Logos blockchain node for logos-core\",\"displayName\":\"Blockchain Module\",\"hashes\":{\"root\":\"90c0117480d693724f3134231faaa713fff7ab582fb05cdd65af1706c23261c4\"},\"icon\":\"\",\"installDir\":\"/private/tmp/doctest-test-40klej89/./session/modules/blockchain_module\",\"installType\":\"user\",\"license\":\"\",\"mainFilePath\":\"/private/tmp/doctest-test-40klej89/./session/modules/blockchain_module/blockchain_module_plugin.dylib\",\"manifestVersion\":\"0.6.0\",\"name\":\"blockchain_module\",\"source\":\"\",\"type\":\"core\",\"version\":\"0.3.0\",\"view\":\"\"}\n", "status": "pass"}], "md": "### 4.3 Confirm the installed version\n\n```bash\nlogosctl package show blockchain_module\n```"}, {"execs": [], "md": "## Step 5: Build a probe module with the pinned module-builder\n\nCalling a module from the CLI proves it answers. It does not prove that\n*another module* can consume it \u2014 the path every real application uses. So\nwe build one, with the `logos-module-builder` release this set pins.\n\nThe probe declares `blockchain_module` as a dependency and supplies the\ncontract itself via `dependency_overrides`, so it compiles against the\ninterface without building `blockchain_module` from source \u2014 what it talks\nto at runtime is the downloaded `.lgx`."}, {"execs": [{"cmd": "mkdir -p probe/src probe/deps\nVER=\"$(\"$RELEASE_SET_DIR/doctests/release-set.sh\" pin modules blockchain_module)\"\ncat > probe/deps/blockchain_module.lidl <<EOF\n; The subset of blockchain_module this probe uses, supplied as a\n; dependency_override so the probe never builds blockchain_module itself.\nmodule blockchain_module {\n  version \"$VER\"\n\n  method get_cryptarchia_info() -> result\n\n  event newBlock(blockJson: tstr)\n}\nEOF\ncat probe/deps/blockchain_module.lidl\n", "exit_code": 0, "kind": "run", "note": "", "output": "; The subset of blockchain_module this probe uses, supplied as a\n; dependency_override so the probe never builds blockchain_module itself.\nmodule blockchain_module {\n  version \"0.3.0\"\n\n  method get_cryptarchia_info() -> result\n\n  event newBlock(blockJson: tstr)\n}\n", "status": "pass"}], "md": "### 5.1 Write the dependency contract\n\n```bash\nmodule blockchain_module {\n  version \"<pinned>\"\n\n  method get_cryptarchia_info() -> result\n\n  event newBlock(blockJson: tstr)\n}\n```"}, {"execs": [{"cmd": "write probe/metadata.json", "kind": "file", "note": "Wrote probe/metadata.json", "status": "pass"}], "md": "### 5.2 Declare the module\n\n```json\n{\n  \"name\": \"probe_blockchain\",\n  \"display_name\": \"Blockchain Probe\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"interface\": \"universal\",\n  \"category\": \"test\",\n  \"description\": \"Calls blockchain_module and latches its newBlock event.\",\n  \"main\": \"probe_blockchain_plugin\",\n  \"dependencies\": [\"blockchain_module\"],\n  \"dependency_overrides\": {\n    \"blockchain_module\": { \"file\": \"deps/blockchain_module.lidl\" }\n  },\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [],\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_sources\": [],\n      \"extra_include_dirs\": [],\n      \"extra_link_libraries\": []\n    }\n  }\n}\n```"}, {"execs": [{"cmd": "TAG=\"$(\"$RELEASE_SET_DIR/doctests/release-set.sh\" pin devUtils logos-module-builder)\"\ncat > probe/flake.nix <<EOF\n{\n  description = \"blockchain_module probe\";\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder/$TAG\";\n  };\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\nEOF\ncat probe/flake.nix\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\n  description = \"blockchain_module probe\";\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder/0.3.2\";\n  };\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\n", "status": "pass"}], "md": "### 5.3 Pin the builder to the release set\n\n```bash\ninputs = {\n  logos-module-builder.url = \"github:logos-co/logos-module-builder/<pinned tag>\";\n};\n```"}, {"execs": [{"cmd": "write probe/CMakeLists.txt", "kind": "file", "note": "Wrote probe/CMakeLists.txt", "status": "pass"}], "md": "### 5.4 Write the build file\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(ProbeBlockchainPlugin LANGUAGES CXX)\n\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found\")\nendif()\n\nfile(READ \"${CMAKE_CURRENT_SOURCE_DIR}/metadata.json\" METADATA_JSON)\nstring(JSON MODULE_NAME GET ${METADATA_JSON} name)\n\nlogos_module(\n    NAME ${MODULE_NAME}\n    SOURCES\n        src/probe_blockchain_impl.h\n        src/probe_blockchain_impl.cpp\n)\n```"}, {"execs": [{"cmd": "write probe/src/probe_blockchain_impl.h", "kind": "file", "note": "Wrote probe/src/probe_blockchain_impl.h", "status": "pass"}], "md": "### 5.5 Write the probe\n\n```cpp\n#pragma once\n\n#include <string>\n#include <logos_json.h>            // LogosMap (nlohmann::json alias)\n#include \"logos_module_context.h\"\n\n/// Probes the blockchain_module pinned by the release set: one call\n/// in, one event subscription out \u2014 and a metrics surface so the\n/// openmetrics module has something to scrape.\nclass ProbeBlockchainImpl : public LogosModuleContext\n{\npublic:\n    /// Subscribes to blockchain_module's newBlock event.\n    std::string subscribe();\n\n    /// How many newBlock events have arrived since subscribing.\n    int64_t blockCount();\n\n    /// Round-trips a call into blockchain_module and returns what it said.\n    std::string chainInfo();\n\n    /// The convention the openmetrics module scrapes:\n    /// {\"metrics\": [ {name, type, help, value, labels?}, ... ]}.\n    ///\n    /// blockchain_module implements neither metrics convention, so\n    /// there is nothing to scrape from it directly. The probe\n    /// publishes what it observed *from* it instead, which makes the\n    /// scrape a real end-to-end signal rather than an empty document.\n    LogosMap collectMetrics();\n\nprivate:\n    int64_t m_blocks = 0;\n};\n```"}, {"execs": [{"cmd": "write probe/src/probe_blockchain_impl.cpp", "kind": "file", "note": "Wrote probe/src/probe_blockchain_impl.cpp", "status": "pass"}], "md": "### 5.6 Write the implementation\n\n```cpp\n#include \"probe_blockchain_impl.h\"\n\n// modules() needs the generated aggregate to be a complete type, so\n// the cross-module calls live here rather than in the header.\n#include \"logos_sdk.h\"\n\nstd::string ProbeBlockchainImpl::subscribe()\n{\n    const bool ok = modules().blockchain_module.onNewBlock(\n        [this](const std::string& blockJson) {\n            (void)blockJson;\n            ++m_blocks;\n        });\n    return ok ? \"ok\" : \"failed\";\n}\n\nint64_t ProbeBlockchainImpl::blockCount()\n{\n    return m_blocks;\n}\n\nstd::string ProbeBlockchainImpl::chainInfo()\n{\n    auto result = modules().blockchain_module.get_cryptarchia_info();\n    // Self-describing so the doc-test can assert the call actually\n    // succeeded rather than that something was printed.\n    return result.success ? (\"probe-call-ok \" + result.value.dump())\n                          : (\"probe-call-failed \" + result.error);\n}\n\nLogosMap ProbeBlockchainImpl::collectMetrics()\n{\n    LogosMap blocks;\n    blocks[\"name\"]  = \"probe_blocks_observed_total\";\n    blocks[\"type\"]  = \"counter\";\n    blocks[\"help\"]  = \"newBlock events received from blockchain_module\";\n    blocks[\"value\"] = m_blocks;\n\n    LogosMap payload;\n    payload[\"metrics\"] = LogosMap::array();\n    payload[\"metrics\"].push_back(blocks);\n    return payload;\n}\n```"}, {"execs": [{"cmd": "cd probe\ngit init -q . && git add -A\nnix build '.#lgx-portable' --no-write-lock-file -o probe-lgx\nls probe-lgx/*.lgx\n", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/private/tmp/doctest-test-40klej89/probe' is dirty\nunpacking 'github:logos-co/logos-module-builder/4b7998272c5ec014bcac4bf1c7dbe7602c63a3c1' into the Git cache...\ncopying path '/nix/store/8sa9pwyzb94syjjd4vl9s618sam4g8q2-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/a30408ybri874zphhix5mrcv6x6jq46y-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/7iigyw9jzka7qz4p9 ackages installed into the running daemon, which re-scanned each\ntime, so they are visible to it now. Installing is not loading, though:\n`package install` puts files on disk, `module load` starts them."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load blockchain_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"blockchain_module\",\"status\":\"ok\",\"version\":\"0.3.0\"}\n", "status": "pass"}], "md": "### 6.1 Load blockchain_module\n\n```bash\nlogosctl module load blockchain_module\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":2581,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"probe_blockchain\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"openmetrics\",\"status\":\"not_loaded\",\"version\":\"0.1.1\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":165,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":165,\"version\":\"1.0.0\"},{\"name\":\"blockchain_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"0.3.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":165,\"version\":\"0.1.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":165,\"version\":\"3.0.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":165,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":6,\"not_loaded\":2}}\n", "status": "pass"}], "md": "### 6.2 Confirm it is loaded\n\n```bash\nlogosctl daemon status\n```"}, {"execs": [], "md": "## Step 7: Initialize the node\n\nThe Run a Logos node guide's blockchain step. `generate_user_config` takes the\ntestnet's initial peers and writes `user_config.yaml` into the **daemon's**\nworking directory; `start` then takes that path plus an empty second\nargument (no deployment file is needed any more)."}, {"execs": [{"cmd": "write peers.json", "kind": "file", "note": "Wrote peers.json", "status": "pass"}], "md": "### 7.1 Write the testnet peer set\n\nThe initial peers from the Run a Logos node guide, verbatim.\n\n```json\n{\n  \"initial_peers\": [\n    \"/ip4/65.109.51.37/udp/3000/quic-v1/p2p/12D3KooWFrouXfmrR4nsLMtE7wu15DoMJ6VtoUtHinREZCvbWHar\",\n    \"/ip4/65.109.51.37/udp/3001/quic-v1/p2p/12D3KooWJRGau8M1rjT7R5e4YYsgdFhsMX35nRDtMwCDjxQkXAHz\",\n    \"/ip4/65.109.51.37/udp/3002/quic-v1/p2p/12D3KooWQXJavMDTRscjauFSgVAB1VLB6Rzpy2uY5SU9Tk7927tb\",\n    \"/ip4/65.109.51.37/udp/50001/quic-v1/p2p/12D3KooWSQc7CcGtvWDPF1yCbBthFnQjprfCVHmfmNDUrSmqQsU1\"\n  ]\n}\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call blockchain_module generate_user_config \"$(cat peers.json)\"", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"generate_user_config\",\"module\":\"blockchain_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"\"},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.2 Generate the node config\n\n```bash\nlogosctl call blockchain_module generate_user_config \"$(cat peers.json)\"\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call blockchain_module start \"$(pwd)/user_config.yaml\" \"\"", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"start\",\"module\":\"blockchain_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.3 Start the node\n\n```bash\nlogosctl call blockchain_module start /path/to/user_config.yaml \"\"\n```"}, {"execs": [{"cmd": "sleep 20", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 20\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call blockchain_module get_cryptarchia_info", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"get_cryptarchia_info\",\"module\":\"blockchain_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"{\\\"height\\\":1783,\\\"lib\\\":\\\"7a0f476e996fe8e75990a3b58f28cb4fc388881feb1c934eb3dd165a01cd815e\\\",\\\"lib_slot\\\":0,\\\"mode\\\":\\\"Bootstrapping\\\",\\\"slot\\\":67058,\\\"tip\\\":\\\"db2ef39021cb6eb608c89453db7d774a680aa1eb37d66fde2ba05f37c1794872\\\"}\"},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.4 Query chain state\n\nCalled once, not polled: repeatedly polling `get_cryptarchia_info` has\nbeen observed to abort the host process, so a single read is both\nenough and safer.\n\n```bash\nlogosctl call blockchain_module get_cryptarchia_info | jq -r .result.value | jq .\n```"}, {"execs": [], "md": "## Step 8: Drive blockchain_module through the probe\n\nThe node is already running, so loading the probe wires it to the live\nmodule. The call below crosses a real inter-module boundary."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load probe_blockchain", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"probe_blockchain\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 8.1 Load the probe\n\n```bash\nlogosctl module load probe_blockchain\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_blockchain chainInfo", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"chainInfo\",\"module\":\"probe_blockchain\",\"result\":\"probe-call-ok \\\"{\\\\\\\"height\\\\\\\":1805,\\\\\\\"lib\\\\\\\":\\\\\\\"7a0f476e996fe8e75990a3b58f28cb4fc388881feb1c934eb3dd165a01cd815e\\\\\\\",\\\\\\\"lib_slot\\\\\\\":0,\\\\\\\"mode\\\\\\\":\\\\\\\"Bootstrapping\\\\\\\",\\\\\\\"slot\\\\\\\":67822,\\\\\\\"tip\\\\\\\":\\\\\\\"da1a44f81c66f840c9778b4fc6568874e5bb64e84cfb4747223753549088eaf2\\\\\\\"}\\\"\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.2 Call the module from the probe\n\n```bash\nlogosctl call probe_blockchain chainInfo\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_blockchain subscribe", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"subscribe\",\"module\":\"probe_blockchain\",\"result\":\"ok\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.3 Subscribe to newBlock\n\n```bash\nlogosctl call probe_blockchain subscribe\n```"}, {"execs": [{"cmd": "sleep 30", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 30\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_blockchain blockCount", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"blockCount\",\"module\":\"probe_blockchain\",\"result\":3669,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.4 Report how many blocks arrived\n\nNot asserted: block arrival depends on how fast this node syncs from\ntestnet peers, which varies. A zero here means the subscription was\nregistered but no block landed inside the window \u2014 informative, not a\nfailure. A non-zero is positive proof the event path works end to end.\n\n```bash\nlogosctl call probe_blockchain blockCount\n```"}, {"execs": [], "md": "## Step 9: Expose the metrics endpoint\n\n`/metrics` is served by the **`openmetrics`** module itself: it runs an HTTP\nserver (libmicrohttpd) and, on every scrape, calls the metrics convention\nmethod on each module named in its config, merging the results into one\nOpenMetrics document with a `module=\"<name>\"` label injected per series.\n\nA module becomes scrapeable by implementing `collectMetrics()` (structured)\nor `collectOpenMetricsText()` (already-rendered text). **`blockchain_module`\nimplements neither**, so there is nothing to scrape from it directly \u2014\nunlike `storage_module` and `delivery_module`, which implement one each.\nThe probe carries the metric instead, publishing the count of `newBlock`\nevents it received from `blockchain_module`. The scrape therefore still\nproves the whole chain: the endpoint serves, the scraper reaches a module\nover IPC from its HTTP thread, and the value it returns came from the\nmodule under test."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load openmetrics", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"openmetrics\",\"status\":\"ok\",\"version\":\"0.1.1\"}\n", "status": "pass"}], "md": "### 9.1 Load the scraper\n\n```bash\nlogosctl module load openmetrics\n```"}, {"execs": [{"cmd": "write openmetrics.json", "kind": "file", "note": "Wrote openmetrics.json", "status": "pass"}], "md": "### 9.2 Point it at the probe\n\n```json\n{\n  \"port\": 9466,\n  \"modules\": [\"probe_blockchain\"]\n}\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call openmetrics start @openmetrics.json", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"start\",\"module\":\"openmetrics\",\"result\":1,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 9.3 Start the server\n\n```bash\nlogosctl call openmetrics start @openmetrics.json\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call openmetrics getInfo", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"getInfo\",\"module\":\"openmetrics\",\"result\":\"{\\\"modules\\\":[{\\\"format\\\":\\\"data\\\",\\\"name\\\":\\\"probe_blockchain\\\"}],\\\"port\\\":9466,\\\"running\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 9.4 Confirm it is serving\n\n```bash\nlogosctl call openmetrics getInfo\n```"}, {"execs": [{"cmd": "curl -s --max-time 30 http://127.0.0.1:9466/metrics", "exit_code": 0, "kind": "run", "note": "", "output": "# HELP probe_blocks_observed newBlock events received from blockchain_module\n# TYPE probe_blocks_observed counter\nprobe_blocks_observed_total{module=\"probe_blockchain\"} 3672\n# EOF\n", "status": "pass"}], "md": "### 9.5 Scrape /metrics\n\nOne HTTP request drives a live collection call into the probe from the\nserver thread. A value of `0` is a legitimate result \u2014 it means no\nblock arrived inside the window \u2014 but the series itself must be there.\n\n```bash\ncurl http://127.0.0.1:9466/metrics\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call openmetrics stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"stop\",\"module\":\"openmetrics\",\"result\":1,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 9.6 Stop the server\n\n```bash\nlogosctl call openmetrics stop\n```"}, {"execs": [], "md": "## Step 10: Shut down\n\nStop the node and the daemon, and confirm the daemon exited cleanly."}, {"execs": [{"cmd": "trap '' TERM\n./bin/logosctl --config-dir ./session call blockchain_module stop || true\nsleep 3\n./bin/logosctl --config-dir ./session daemon stop || true\ntrue\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"stop\",\"module\":\"blockchain_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 10.1 Stop\n\n```bash\ntrap '' TERM\n./bin/logosctl --config-dir ./session call blockchain_module stop || true\nsleep 3\n./bin/logosctl --config-dir ./session daemon stop || true\ntrue\n\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"reason\":\"No daemon running (no local endpoint at /var/folders/36/tjdph2t965j8snz9_vkdnw0r0000gn/T/logos_core_service_a7ab8bc93469). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"not_running\"}}\n", "status": "pass"}], "md": "### 10.2 Confirm\n\n```bash\nlogosctl daemon status\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
