<script id="report-data" type="application/json">{"generated_platform": "windows-latest", "summary": {"failed": 0, "passed": 25, "skipped": 0}, "tutorials": [{"meta": {"name": "Validating the pinned storage_module", "output": "headless-storage-module.md"}, "rows": [{"execs": [], "md": "# Validating the pinned storage_module\n\nThis doc-test validates the `storage_module` pinned by\n[`release-set.json`](../release-set.json) \u2014 not the latest `master`, not a\nlocal build: **exactly the artifacts a user would install**.\n\nEverything runs from released binaries. `logosctl` \u2014 the runtime and the\npackage manager in one \u2014 is downloaded from its GitHub release at the tag the\nrelease set pins; `storage_module` is pulled from the module catalog at the\npinned version and installed into the session, checksum-verified against the\ncatalog index. The node comes up as the\n[Run a Logos node](https://docs.logos.co/run-a-node) guide describes for\nTestnet v0.3: the package downloader starts it.\n\nThen it goes two steps further than \"the module loads\". It builds a small\n**probe module** with the `logos-module-builder` release the set pins, and\nuses that probe to call `storage_module` and subscribe to one of its events\nfrom inside the runtime. Finally it loads the pinned **`openmetrics`** module\nand scrapes `/metrics` over HTTP, proving the storage module's metrics reach\na real endpoint.\n\nA green run means the pinned storage module is installable, loadable,\ncallable, emits the events other modules depend on, and reports metrics.\n\nThe spec runs on Windows too. Nix does not run there, so CI prepares that leg\non Linux: it unpacks the pinned release's `logosctl-x86_64-windows.zip` and\ncross-builds the probe with the pinned builder, then runs the steps marked\nfor Windows on `windows-latest`. `openmetrics` publishes no Windows build, so\nthe metrics section runs on Linux and macOS only.\n\n**What you'll build:** The pinned `storage_module`, installed from the catalog and driven through a `logosctl` daemon and a purpose-built probe module.\n\n**What you'll learn:**\n\n- How a release set pins tools by release tag and modules by catalog version\n- How to install an exact module version with `logosctl package download --version`\n- How the package downloader starts the storage node, and how to wait for it\n- How to observe a module's events with `logosctl watch`\n- How to build a probe module that calls a dependency and subscribes to its events\n- Which module serves `/metrics`, and how it scrapes others over IPC\n- How the Windows half runs on artifacts CI prepares on Linux\n\n## Prerequisites\n\n- **A Linux or macOS machine** (linux-x86_64, linux-arm64 or macos-arm64).\n- **Nix** with flakes enabled \u2014 used only to build the probe module; the tool and modules under test come from released binaries.\n- **`RELEASE_SET_DIR`** pointing at the `logos-release-set` checkout, and **`GITHUB_TOKEN`** set (resolving the set hits the GitHub API).\n- **For the Windows half**, Git Bash with `curl` and `jq`, in a directory holding this repository's `flake.nix` targets as `logos-windows-ci` stages them: `release-set/`, `logosctl/` and `probe-storage/`."}, {"execs": [], "md": "## Step 1: Resolve the release set\n\n`release-set.json` carries the minimum a human types \u2014 a tag per app, a\nversion per catalog package. The resolver turns that into\n`release-set.lock.json`: repository URL, commit hash, download URL and\nchecksum for every artifact. Every later step reads the lock, so the whole\ndoc-test is pinned to one immutable set."}, {"execs": [], "md": "### 1.1 Resolve\n\n```bash\n./doctests/release-set.sh lock\n```\n\nEach line is a pinned artifact and the commit it was built from. For\ncatalog packages that commit is the submodule gitlink in\n`logos-modules-release` at the package's release tag \u2014 the exact source\nthe `.lgx` was built from."}, {"execs": [{"cmd": "bash release-set/windows.sh pins", "exit_code": 0, "kind": "run", "output": "  logos-basecamp  0.3.1\n  logos-logoscore-cli  0.3.1\n  logos-package-manager  0.3.0\n  logos-module-builder  0.3.2\n  logos-module  0.3.0\n  logos-package  0.1.0\n  blockchain_module  0.3.0\n  chat_module  0.3.0\n  delivery_module  0.3.0\n  lez_core  0.5.0\n  lez_indexer_module  1.2.0\n  liblogos_lez_rln_module  4.2.1\n  liblogos_rln_module  0.10.0\n  libp2p_module  1.1.0\n  openmetrics  0.1.1\n  storage_module  3.0.0\n  blockchain_ui  0.3.0\n  chat_ui  0.3.0\n  lez_explorer_ui  1.2.0\n  lez_wallet_ui  1.2.0\n  storage_ui  3.0.0\n", "status": "pass"}], "md": "### 1.2 Read the pins\n\nWindows resolves nothing. CI read the lock on Linux to pin this leg's\ninputs, the builder tag and the `logosctl` release, and staged\n`release-set.json` with a helper that reads it.\n\n```bash\nbash release-set/windows.sh pins\n```"}, {"execs": [], "md": "## Step 2: Fetch the pinned runtime\n\n`logosctl` is the headless runtime and the package manager in one: it\nloads and drives modules, and it bundles `package_manager` and\n`package_downloader` so installing from the catalog is the same binary's\njob. One artifact, at the tag the release set pins. On Linux it ships as\nan AppImage, which we extract rather than mount \u2014 CI runners have no\nFUSE. On macOS it ships as a directory bundle.\n\nThe release publishes the older `logoscore` alongside it, so the fetch\nnames the binary it wants rather than taking whichever asset happens to\nmatch the platform."}, {"execs": [], "md": "### 2.1 Fetch logosctl\n\n```bash\n./doctests/release-set.sh fetch logos-logoscore-cli logosctl\n```"}, {"execs": [{"cmd": "check file: bin/logosctl", "exit_code": 0, "kind": "check_file", "output": "bin/logosctl\n", "status": "pass"}], "md": "### 2.2 Use the staged release\n\nOn Windows the pinned release's `logosctl-x86_64-windows.zip` is\nalready here, unpacked as `logosctl/`. The helper writes the same\n`./bin/logosctl` wrapper as `fetch` does elsewhere; `logosctl.exe`\nstays in its bundle, next to `logos_host.exe` and the modules it ships.\n\n```bash\nbash release-set/windows.sh link logosctl\n```"}, {"execs": [{"cmd": "./bin/logosctl --version", "exit_code": 0, "kind": "run", "output": "logosctl version 0.3.1\ncommit: 4d47b0ee48217ed752c5f8bfff7436d59b7eb2da\ndependency commits:\n  logos-liblogos db45024f5c45ce5fc00ab76a6921985839ad7355\n  logos-cpp-sdk 3f34c0b216c8fbdbf2093056b9f0fc53d89f05a1\n  logos-protocol 8bbc027c99505c3c2f043265f8c1ae8ff899bdff\n  logos-plugin-qt 3a471be14af66d099827ee712ec8c40ead701340\n  logos-capability-module 1a1b8b5a1167931afbf41ebaafbe76034e6357a0\n  logos-modules-state-module ed0f4ba534520542764775efc1d0ef705a02e616\n  logos-package-manager-module 41df424fe04155c243db090659cef619e070a60b\n  logos-package-downloader-module d40d4ab906e4e093c43c69c374ca1b6ec9e85ab8\n  logos-storage-module a9c14b8c977da51310361b03fe4d9efd763ae926\n", "status": "pass"}], "md": "### 2.3 Confirm the version\n\n```bash\nlogosctl --version\n```"}, {"execs": [], "md": "## Step 3: Start a session\n\nEverything `logosctl` owns \u2014 installed modules, UI plugins, catalogs,\ntrusted keys, logs \u2014 lives in one **session** directory, and\n`--config-dir` picks which. Pointing it at `./session` keeps this\ndoc-test out of `~/.logosctl`, so nothing it installs touches the machine\nthat ran it.\n\nThe daemon starts *before* anything is installed: package commands are\nserved by the bundled `package_manager`, which lives inside the running\ndaemon, and the daemon re-scans its module directories after every\ninstall."}, {"execs": [], "md": "### 3.1 Start the daemon\n\n`--detach` is not `&`. Backgrounding returns before the transports\nhave bound; `--detach` returns only once the daemon has published its\nstate file and is answering commands, so nothing below races the boot.\nThe daemon gets a `HOME` inside this run's directory. As soon as it\nis up, the package downloader starts the storage node with its default\nconfiguration, which keeps the node's data in `~/.logos_storage`; this\nkeeps a run clear of a real node there, such as Basecamp's.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "mkdir -p home\nHOME=\"$(cygpath -m \"$PWD\")/home\" ./bin/logosctl --config-dir ./session daemon start --detach\n", "exit_code": 0, "kind": "run", "output": "Daemon started (pid 3868)\nLogs: D:\\a\\logos-release-set\\logos-release-set\\stage\\session/logs\\daemon.log\n", "status": "pass"}], "md": "### 3.2 Start the daemon\n\nThe same command. `logosctl` is a native Windows program, so `HOME`\nis given in Windows form; the storage module reads it before\n`USERPROFILE`.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status", "exit_code": 0, "kind": "run", "output": "{\"daemon\":{\"pid\":3868,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"3.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"0.1.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":5,\"not_loaded\":0}}\n", "status": "pass"}], "md": "### 3.3 Confirm it is up\n\n```bash\nlogosctl daemon status\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session catalog ls", "exit_code": 0, "kind": "run", "output": "[{\"description\":\"Curated official Logos modules.\",\"displayName\":\"Logos Official\",\"enabled\":true,\"homepage\":\"https://github.com/logos-co/logos-modules-release\",\"includeWarnings\":[],\"includes\":[],\"includesUrl\":\"\",\"indexUrl\":\"https://github.com/logos-co/logos-modules-release/ tage/packages/storage_module-3.0.0.lgx\",\"fromVersion\":\"3.0.0\",\"name\":\"storage_module\",\"signature\":\"unsigned\",\"toVersion\":\"3.0.0\"}],\"installed\":[\"storage_module\"],\"op\":\"install\",\"reloaded\":[\"storage_module\"],\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.2 Download, verify and install\n\nThe same two commands. With no lock on Windows, the helper takes the\nexpected `sha256` from the catalog index the resolver reads.\n\n```bash\nlogosctl package download storage_module --version <pinned> -o packages\nlogosctl package install --file packages/storage_module-*.lgx -y\n```"}, {"execs": [], "md": "### 4.3 Install the metrics scraper too\n\n`openmetrics` is the module that serves the `/metrics` endpoint later\nin this doc-test. It publishes no Windows build.\n\n```bash\nlogosctl package download openmetrics --version <pinned> -o packages\nlogosctl package install --file packages/openmetrics-*.lgx -y\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session package ls", "exit_code": 0, "kind": "run", "output": "[{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Online package catalog and download service\",\"displayName\":\"Package Downloader\",\"hashes\":{\"root\":\"7def92cb41d4003786e3c7f6e7fa85259687579e0a18fc41472c1db5e293e89b\"},\"icon\":\"\",\"installDir\":\"D:\\\\a\\\\logos-release-set\\\\logos-release-set\\\\stage\\\\logosctl\\\\modules-pkg\\\\package_downloader\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"D:\\\\a\\\\logos-release-set\\\\logos-release-set\\\\stage\\\\logosctl\\\\modules-pkg\\\\package_downloader\\\\package_downloader_plugin.dll\",\"manifestVersion\":\"0.5.0\",\"name\":\"package_downloader\",\"source\":\"\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Plugin manager for the Logos system\",\"displayName\":\"Package Manager\",\"hashes\":{\"root\":\"a43bbde86edfd35e93c2c434d52cac6ff7a60d25774656d15efa3e6ddbb3e411\"},\"icon\":\"\",\"installDir\":\"D:\\\\a\\\\logos-release-set\\\\logos-release-set\\\\stage\\\\logosctl\\\\modules-pkg\\\\package_manager\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"D:\\\\a\\\\logos-release-set\\\\logos-release-set\\\\stage\\\\logosctl\\\\modules-pkg\\\\package_manager\\\\package_manager_plugin.dll\",\"manifestVersion\":\"0.5.0\",\"name\":\"package_manager\",\"source\":\"\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"protocol\",\"dependencies\":[],\"description\":\"Storage module\",\"displayName\":\"Storage Module\",\"hashes\":{\"root\":\"167ad21b8f3cc1b43f64df0ac5970c4583ad5e7efc3266eb6323415d32d318b4\"},\"icon\":\"\",\"installDir\":\"D:\\\\a\\\\logos-release-set\\\\logos-release-set\\\\stage\\\\session/modules\\\\storage_module\",\"installType\":\"user\",\"license\":\"\",\"mainFilePath\":\"D:\\\\a\\\\logos-release-set\\\\logos-release-set\\\\stage\\\\session/modules\\\\storage_module\\\\storage_module_plugin.dll\",\"manifestVersion\":\"0.6.0\",\"name\":\"storage_module\",\"source\":\"\",\"type\":\"core\",\"version\":\"3.0.0\",\"view\":\"\"}]\n", "status": "pass"}], "md": "### 4.4 Confirm what landed\n\n`SOURCE` separates what this session installed (`user`) from the\nmodules shipped read-only beside the binary (`embedded`) \u2014 which is\nwhere `capability_module`, the auth handshake every load needs, comes\nfrom. Nothing had to be seeded by hand.\n\n```bash\nlogosctl package ls\n```"}, {"execs": [], "md": "## Step 5: Build a probe module with the pinned module-builder\n\nCalling a module from the CLI proves it answers. It does not prove that\n*another module* can consume it \u2014 the path every real application uses.\nSo we build one, with the `logos-module-builder` release this set pins.\n\nThe probe declares `storage_module` as a dependency and supplies the\ncontract itself via `dependency_overrides`. That matters: a contract file\nmeans the probe compiles against the *interface* without building\n`storage_module` from source, so what it talks to at runtime is the\ndownloaded `.lgx` and nothing else. (This is the same mechanism\n`logos-chat-module` uses for its `delivery_module` dependency.)"}, {"execs": [], "md": "### 5.1 Write the dependency contract\n\nOnly the subset the probe uses. `logos-lidl` turns this into a typed\nclient for the probe.\n\n```\n; The subset of storage_module this probe uses, supplied as a\n; dependency_override so the probe never builds storage_module itself.\nmodule storage_module {\n  method moduleVersion() -> tstr\n  method uploadUrl(filePath: tstr, chunkSize: int, advertise: bool) -> result\n\n  event storageUploadDone(payload: tstr)\n}\n```"}, {"execs": [], "md": "### 5.2 Declare the module\n\n```json\n{\n  \"name\": \"probe_storage\",\n  \"display_name\": \"Storage Probe\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"interface\": \"universal\",\n  \"category\": \"test\",\n  \"description\": \"Calls storage_module and latches one of its events.\",\n  \"main\": \"probe_storage_plugin\",\n  \"dependencies\": [\"storage_module\"],\n  \"dependency_overrides\": {\n    \"storage_module\": { \"file\": \"deps/storage_module.lidl\" }\n  },\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [],\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_sources\": [],\n      \"extra_include_dirs\": [],\n      \"extra_link_libraries\": []\n    }\n  }\n}\n```"}, {"execs": [], "md": "### 5.3 Pin the builder to the release set\n\nThe one input that matters: `logos-module-builder` at the tag the\nrelease set pins. That is what \"built with the dev utils this release\nset ships\" means concretely.\n\n```bash\ninputs = {\n  logos-module-builder.url = \"github:logos-co/logos-module-builder/<pinned tag>\";\n};\n```"}, {"execs": [], "md": "### 5.4 Write the build file\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(ProbeStoragePlugin LANGUAGES CXX)\n\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found\")\nendif()\n\nfile(READ \"${CMAKE_CURRENT_SOURCE_DIR}/metadata.json\" METADATA_JSON)\nstring(JSON MODULE_NAME GET ${METADATA_JSON} name)\n\nlogos_module(\n    NAME ${MODULE_NAME}\n    SOURCES\n        src/probe_storage_impl.h\n        src/probe_storage_impl.cpp\n)\n```"}, {"execs": [], "md": "### 5.5 Write the probe\n\nA universal module: you write the implementation class, and the Qt\nplugin glue is generated from this header. Module code stays Qt-free \u2014\n`std::string`, not `QString`.\n\n```cpp\n#pragma once\n\n#include <string>\n#include \"logos_module_context.h\"\n\n/// Probes the storage_module pinned by the release set: one call in,\n/// one event out. Deriving LogosModuleContext gives us modules() \u2014\n/// typed callers and typed event subscriptions for everything in\n/// metadata.json#dependencies.\nclass ProbeStorageImpl : public LogosModuleContext\n{\npublic:\n    /// Subscribes to storage_module's storageUploadDone event.\n    /// Returns \"ok\" once the subscription is registered.\n    std::string subscribe();\n\n    /// The payload of the last storageUploadDone we received.\n    /// Empty until one arrives.\n    std::string lastUploadEvent();\n\n    /// Round-trips a call into storage_module. Returns a\n    /// self-describing string so the doc-test can assert the call\n    /// actually succeeded rather than that something was printed.\n    std::string targetVersion();\n\nprivate:\n    std::string m_lastUpload;\n};\n```"}, {"execs": [], "md": "### 5.6 Write the implementation\n\n```cpp\n#include \"probe_storage_impl.h\"\n\n// modules() needs the generated aggregate to be a complete type, so\n// the cross-module calls live here rather than in the header.\n#include \"logos_sdk.h\"\n\nstd::string ProbeStorageImpl::subscribe()\n{\n    const bool ok = modules().storage_module.onStorageUploadDone(\n        [this](const std::string& payload) { m_lastUpload = payload; });\n    return ok ? \"ok\" : \"failed\";\n}\n\nstd::string ProbeStorageImpl::lastUploadEvent()\n{\n    return m_lastUpload;\n}\n\nstd::string ProbeStorageImpl::targetVersion()\n{\n    const std::string version = modules().storage_module.moduleVersion();\n    return version.empty() ? \"probe-call-failed: empty version\"\n                           : \"probe-call-ok version=\" + version;\n}\n```"}, {"execs": [], "md": "### 5.7 Build it as a portable package\n\n`#lgx-portable`, not `#lgx`. The host is a released (portable)\n`logosctl` and the storage module came from the catalog as a portable\nvariant; a dev build would RPATH into `/nix/store` and refuse to load\nbeside them.\nNix only sees files git knows about, so the probe is committed first.\nThe link is named after the target CI cross-builds for Windows, so\nthe next step reads the same path on every platform.\n\n```bash\ngit init && git add -A\nnix build '.#lgx-portable' -o ../probe-storage\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session package install --file probe-storage/*.lgx -y", "exit_code": 0, "kind": "run", "output": "{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"D:\\\\a\\\\logos-release-set\\\\logos-release-set\\\\stage\\\\probe-storage\\\\logos-probe_storage-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"probe_storage\",\"signature\":\"unsigned\",\"toVersion\":\"1.0.0\"}],\"installed\":[\"probe_storage\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.8 Install the probe\n\nA path ending in `.lgx` is read as a file, so this never touches the\ncatalog. The probe is unsigned and installs anyway: the session's\n`signature_policy` defaults to `warn`, which is what a locally built\nmodule needs.\n\nOn Windows, `probe-storage/` holds the probe CI cross-built with the\nsame pinned builder from `doctests/probes/storage`: the files above,\nwhich `scripts/check-probes.py` keeps identical to this spec.\n\n```bash\nlogosctl package install --file probe-storage/*.lgx -y\n```"}, {"execs": [], "md": "## Step 6: Load the module\n\nEverything installed while the daemon was already running, and it\nre-scanned each time, so there is nothing to restart \u2014 the modules are\nvisible to it now. Installing is not loading, though: `package install`\nputs files on disk, `module load` starts them."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module ls", "exit_code": 0, "kind": "run", "output": "[{\"name\":\"probe_storage\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":19,\"version\":\"1.0.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"3.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":19,\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":19,\"version\":\"0.1.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":19,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 6.1 List what the daemon can see\n\n```bash\nlogosctl module ls\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load storage_module", "exit_code": 0, "kind": "run", "output": "{\"dependencies_loaded\":[],\"module\":\"storage_module\",\"status\":\"ok\",\"version\":\"3.0.0\"}\n", "status": "pass"}], "md": "### 6.2 Load it\n\nDependencies come with it, always \u2014 there is no opt-out.\n\n```bash\nlogosctl module load storage_module\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status", "exit_code": 0, "kind": "run", "output": "{\"daemon\":{\"pid\":3868,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"probe_storage\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":20,\"version\":\"1.0.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":2,\"version\":\"3.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":20,\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":20,\"version\":\"0.1.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":20,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":5,\"not_loaded\":1}}\n", "status": "pass"}], "md": "### 6.3 Confirm it is loaded\n\n```bash\nlogosctl daemon status\n```"}, {"execs": [], "md": "## Step 7: Wait for the storage node\n\nTestnet v0.3 changed how a storage node comes up. The package downloader\nfetches packages through `storage_module`, so it starts the node itself,\nwith its saved configuration or the defaults on first use; as the\n[Run a Logos node](https://docs.logos.co/run-a-node) guide says, there is\nnothing to `init` or `start`. Installing the pinned package reloaded the\nmodule and the downloader started it again, so the node that comes up is\nthe pinned one."}, {"execs": [{"cmd": "deadline=$(( $(date +%s) + 720 ))\nout=\"\"\nwhile [ \"$(date +%s)\" -lt \"$deadline\" ]; do\n  out=\"$(./bin/logosctl --config-dir ./session call storage_module isRunning 2>&1)\"\n  case \"$out\" in *'\"result\":true'*) break ;; esac\n  sleep 5\ndone\nprintf '%s\\n' \"$out\"\n", "exit_code": 0, "kind": "run", "output": "{\"method\":\"isRunning\",\"module\":\"storage_module\",\"result\":true,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.1 Wait until it is running\n\nThe node reports running only once its bootstrap dials resolve. On a\nnetwork that cannot reach the bootstrap nodes that took 9 minutes on\nWindows, so this waits up to 12.\n\n```bash\nlogosctl call storage_module isRunning\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call storage_module deb 6Uiu2HAm17wqb6L3gNU1n2jNTbQGXXYS6wqm9QbHCtoWCypN9NEM\"},{\"addresses\":[\"/ip4/87.75.26.69/tcp/49153\",\"/ip4/87.75.26.69/tcp/49153/mix-transport/Am19KIKjEjNEK5RNVC3zjzUBFs3iDwXqYnEUcYANOanG8S1c-SZ96C-F1DTGM4Lah_8GPbuGETBZkD7oYl9WCFY=\"],\"lastSeen\":1790941000,\"peerId\":\"16Uiu2HAm2o57K68ukppJFYr34RUPfKaK1JCcG3vAYZKUkUBfYnHT\"},{\"addresses\":[\"/ip4/71.59.205.7/tcp/8091\",\"/ip4/71.59.205.7/tcp/8091/mix-transport/AzOheHRAXNq-VajA8lJLM9f2j97ia9JfsXMM_6LXUAOHgDXOO3djxwFR2dVzleV_bBFaKgpJ8xEA-Nt46Jx1vEA=\"],\"lastSeen\":1790941000,\"peerId\":\"16Uiu2HAmG8XwyDphqHVMtWyFQcpUhtjWJnYFooVhbCzGbAWGciut\"}]}}},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.2 Inspect it\n\n`debug` reports the node's peer ID (`id`) and its signed peer record (`spr`).\n\n```bash\nlogosctl call storage_module debug | jq .result.value.id\n```"}, {"execs": [], "md": "## Step 8: Drive storage_module through the probe\n\nThe daemon is already running with the storage node started, so loading the\nprobe wires it to the live module. Everything below crosses a real\ninter-module boundary."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load probe_storage", "exit_code": 0, "kind": "run", "output": "{\"dependencies_loaded\":[],\"module\":\"probe_storage\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 8.1 Load the probe\n\n```bash\nlogosctl module load probe_storage\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_storage targetVersion", "exit_code": 0, "kind": "run", "output": "{\"method\":\"targetVersion\",\"module\":\"probe_storage\",\"result\":\"probe-call-ok version=3.0.0\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.2 Call storage_module from the probe\n\nA cross-module call: probe -> storage_module -> back.\n\n```bash\nlogosctl call probe_storage targetVersion\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_storage subscribe", "exit_code": 0, "kind": "run", "output": "{\"method\":\"subscribe\",\"module\":\"probe_storage\",\"result\":\"ok\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.3 Subscribe to the event\n\n```bash\nlogosctl call probe_storage subscribe\n```"}, {"execs": [{"cmd": "sh -c './bin/logosctl --config-dir ./session watch storage_module --event storageUploadDone --json > upload-event.txt 2>&1 & echo $! > watch.pid'", "exit_code": 0, "kind": "run", "output": "", "status": "pass"}], "md": "### 8.4 Watch for the upload event\n\n```bash\nlogosctl watch storage_module --event storageUploadDone --json\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "echo \"hello from the release set\" > hello.txt\n./bin/logosctl --config-dir ./session call storage_module uploadUrl \"$(pwd)/hello.txt\" 65536 true\n", "exit_code": 0, "kind": "run", "output": "{\"method\":\"uploadUrl\",\"module\":\"storage_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"0\"},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.5 Trigger an upload\n\nUploading a file makes `storage_module` emit `storageUploadDone`. The\nprobe is subscribed, so the payload lands in its state. The third\nargument, `advertise`, announces the new content to the network.\n\n```bash\nlogosctl call storage_module uploadUrl \"$(pwd)/hello.txt\" 65536 true\n```"}, {"execs": [{"cmd": "for i in $(seq 1 30); do grep -q cid upload-event.txt && break; sleep 1; done\nkill \"$(cat watch.pid)\" 2>/dev/null || true\ncat upload-event.txt\n", "exit_code": 0, "kind": "run", "output": "{\"data\":{\"arg0\":\"{\\\"cid\\\":\\\"zDvZRwzm5oWpet4a5qfodHwCmCbHpRACbkz4372Yaxbz8UnX2NiF\\\",\\\"sessionId\\\":\\\"0\\\",\\\"success\\\":true}\"},\"event\":\"storageUploadDone\",\"module\":\"storage_module\",\"timestamp\":\"2026-10-02T11:40:46Z\"}\n", "status": "pass"}], "md": "### 8.6 Confirm the event arrived\n\n```bash\ncat upload-event.txt\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_storage lastUploadEvent", "exit_code": 0, "kind": "run", "output": "{\"method\":\"lastUploadEvent\",\"module\":\"probe_storage\",\"result\":\"{\\\"cid\\\":\\\"zDvZRwzm5oWpet4a5qfodHwCmCbHpRACbkz4372Yaxbz8UnX2NiF\\\",\\\"sessionId\\\":\\\"0\\\",\\\"success\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.7 Read the event back out of the probe\n\n```bash\nlogosctl call probe_storage lastUploadEvent\n```\n\nThat payload was produced by the pinned `storage_module`, delivered\nacross the runtime's event channel, and captured by a module built with\nthe pinned `logos-module-builder`. Calls and events both work in the set\nas pinned."}, {"execs": [], "md": "## Step 9: Expose the metrics endpoint\n\n`/metrics` is served by the **`openmetrics`** module itself: it runs an HTTP\nserver (libmicrohttpd) and, on every scrape, calls the metrics convention\nmethod on each module named in its config, merging the results into one\nOpenMetrics document with a `module=\"<name>\"` label injected per series.\n\n`storage_module` implements the structured `collectMetrics()` convention,\nso it is named as a bare string. (A module that already renders\nOpenMetrics text implements `collectOpenMetricsText()` instead and is named\nas `{\"name\": \"...\", \"format\": \"text\"}`.)"}, {"execs": [], "md": "### 9.1 Load the scraper\n\n```bash\nlogosctl module load openmetrics\n```"}, {"execs": [], "md": "### 9.2 Point it at the storage module\n\n```json\n{\n  \"port\": 9464,\n  \"modules\": [\"storage_module\"]\n}\n```"}, {"execs": [], "md": "### 9.3 Start the server\n\n```bash\nlogosctl call openmetrics start @openmetrics.json\n```"}, {"execs": [], "md": "### 9.4 Confirm it is serving\n\n```bash\nlogosctl call openmetrics getInfo\n```"}, {"execs": [], "md": "### 9.5 Scrape /metrics\n\nOne HTTP request drives a live collection call into `storage_module`\nfrom the server thread. The `module=\"storage_module\"` label is proof the\nseries came from the pinned module rather than from the scraper itself;\n`# EOF` is the OpenMetrics document terminator.\n\n```bash\ncurl http://127.0.0.1:9464/metrics\n```"}, {"execs": [], "md": "### 9.6 Stop the server\n\n```bash\nlogosctl call openmetrics stop\n```"}, {"execs": [], "md": "## Step 10: Shut down\n\nStop the daemon and confirm it exited cleanly."}, {"execs": [{"cmd": "trap '' TERM\n./bin/logosctl --config-dir ./session daemon stop || true\ntrue\n", "exit_code": 0, "kind": "run", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 10.1 Stop\n\n```bash\ntrap '' TERM\n./bin/logosctl --config-dir ./session daemon stop || true\ntrue\n\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status || true", "exit_code": 0, "kind": "run", "output": "{\"daemon\":{\"instance_id\":\"261b8c3eebcb\",\"status\":\"not_running\",\"version\":\"0.3.1\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "status": "pass"}], "md": "### 10.2 Confirm\n\n```bash\nlogosctl daemon status\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
