catalog version\n- How to install an exact module version with `logosctl package download --version`\n- How to create and start a delivery node headlessly, following the Run a Logos node guide\n- How to subscribe to a dependency's typed events from another module\n- Why a probe subscribes before the lifecycle call that fires the event\n- Which module serves `/metrics`, and how `\"format\": \"text\"` picks the collection convention\n- How the Windows half runs on artifacts CI prepares on Linux\n\n## Prerequisites\n\n- **A Linux or macOS machine** (linux-x86_64, linux-arm64 or macos-arm64).\n- **Nix** with flakes enabled \u2014 used only to build the probe module; the tool and modules under test come from released binaries.\n- **`RELEASE_SET_DIR`** pointing at the `logos-release-set` checkout, and **`GITHUB_TOKEN`** set (resolving the set hits the GitHub API).\n- **For the Windows half**, Git Bash with `curl` and `jq`, in a directory holding this repository's `flake.nix` targets as `logos-windows-ci` stages them: `release-set/`, `logosctl/` and `probe-delivery/`."}, {"execs": [], "md": "## Step 1: Resolve the release set\n\nThe resolver turns the pinned tags and versions in `release-set.json` into\n`release-set.lock.json` \u2014 repository URL, commit, download URL and checksum\nfor every artifact. Every later step reads the lock."}, {"execs": [], "md": "### 1.1 Resolve\n\n```bash\n./doctests/release-set.sh lock\n```"}, {"execs": [{"cmd": "bash release-set/windows.sh pins", "exit_code": 0, "kind": "run", "output": "  logos-basecamp  0.3.1\n  logos-logoscore-cli  0.3.1\n  logos-package-manager  0.3.0\n  logos-module-builder  0.3.2\n  logos-module  0.3.0\n  logos-package  0.1.0\n  blockchain_module  0.3.0\n  chat_module  0.3.0\n  delivery_module  0.3.0\n  lez_core  0.5.0\n  lez_indexer_module  1.2.0\n  liblogos_lez_rln_module  4.2.1\n  liblogos_rln_module  0.10.0\n  libp2p_module  1.1.0\n  openmetrics  0.1.1\n  storage_module  3.0.0\n  blockchain_ui  0.3.0\n  chat_ui  0 scans its module directories after every\ninstall. `capability_module` \u2014 the auth handshake every load needs \u2014 is\nbundled beside the binary too, so nothing has to be seeded by hand."}, {"execs": [], "md": "### 3.1 Start the daemon\n\n`--detach` is not `&`. Backgrounding returns before the transports\nhave bound; `--detach` returns only once the daemon has published its\nstate file and is answering commands.\nThe daemon gets a `HOME` inside this run's directory. As soon as it\nis up, the package downloader starts the storage node with its default\nconfiguration, which keeps the node's data in `~/.logos_storage`; this\nkeeps a run clear of a real node there, such as Basecamp's.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "mkdir -p home\nHOME=\"$(cygpath -m \"$PWD\")/home\" ./bin/logosctl --config-dir ./session daemon start --detach\n", "exit_code": 0, "kind": "run", "output": "Daemon started (pid 4568)\nLogs: D:\\a\\logos-release-set\\logos-release-set\\stage\\session/logs\\daemon.log\n", "status": "pass"}], "md": "### 3.2 Start the daemon\n\nThe same command. `logosctl` is a native Windows program, so `HOME`\nis given in Windows form; the storage module reads it before\n`USERPROFILE`.\n\n```bash\nlogosctl --config-dir ./session daemon start --detach\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status", "exit_code": 0, "kind": "run", "output": "{\"daemon\":{\"pid\":4568,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"3.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"0.1.0\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"v e download delivery_module --version 0.3.0\n    sha256 OK (f744f0f9ef84\u00e2\u20ac\u00a6)\n{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"D:/a/logos-release-set/logos-release-set/stage/packages/delivery_module-0.3.0.lgx\",\"fromVersion\":\"\",\"name\":\"delivery_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.3.0\"}],\"installed\":[\"delivery_module\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 4.2 Download, verify and install\n\nThe same two commands. With no lock on Windows, the helper takes the\nexpected `sha256` from the catalog index the resolver reads.\n\n```bash\nlogosctl package download delivery_module --version <pinned> -o packages\nlogosctl package install --file packages/delivery_module-*.lgx -y\n```"}, {"execs": [], "md": "### 4.3 Install the metrics scraper too\n\n`openmetrics` serves the `/metrics` endpoint later in this doc-test.\nIt publishes no Windows build.\n\n```bash\nlogosctl package download openmetrics --version <pinned> -o packages\nlogosctl package install --file packages/openmetrics-*.lgx -y\n```"}, {"execs": [], "md": "## Step 5: Build a probe module with the pinned module-builder\n\nThe probe is built **before** the node starts, because it needs to be\nsubscribed when `nodeStarted` fires. It declares `delivery_module` as a\ndependency and supplies the contract itself via `dependency_overrides`, so\nit compiles against the interface without building `delivery_module` from\nsource \u2014 what it talks to at runtime is the downloaded `.lgx`."}, {"execs": [], "md": "### 5.1 Write the dependency contract\n\n```\n; The subset of delivery_module this probe uses, supplied as a\n; dependency_override so the probe never builds delivery_module itself.\nmodule delivery_module {\n  method getNodeInfo(nodeInfoId: tstr) -> result\n\n  event nodeStarted(success: bool, message: tstr, timestamp: int)\n}\n```"}, {"execs": [], "md": "### 5.2 Declare the module\n\n```json\n{\n  \"name\": \"probe_delivery\",\n  \"display_name\": \"Delivery Probe\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"interface\": \"universal\",\n  \"category\": \"test\",\n  \"description\": \"Calls delivery_module and latches its nodeStarted event.\",\n  \"main\": \"probe_delivery_plugin\",\n  \"dependencies\": [\"delivery_module\"],\n  \"dependency_overrides\": {\n    \"delivery_module\": { \"file\": \"deps/delivery_module.lidl\" }\n  },\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [],\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_sources\": [],\n      \"extra_include_dirs\": [],\n      \"extra_link_libraries\": []\n    }\n  }\n}\n```"}, {"execs": [], "md": "### 5.3 Pin the builder to the release set\n\n```bash\ninputs = {\n  logos-module-builder.url = \"github:logos-co/logos-module-builder/<pinned tag>\";\n};\n```"}, {"execs": [], "md": "### 5.4 Write the build file\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(ProbeDeliveryPlugin LANGUAGES CXX)\n\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found\")\nendif()\n\nfile(READ \"${CMAKE_CURRENT_SOURCE_DIR}/metadata.json\" METADATA_JSON)\nstring(JSON MODULE_NAME GET ${METADATA_JSON} name)\n\nlogos_module(\n    NAME ${MODULE_NAME}\n    SOURCES\n        src/probe_delivery_impl.h\n        src/probe_delivery_impl.cpp\n)\n```"}, {"execs": [], "md": "### 5.5 Write the probe\n\n```cpp\n#pragma once\n\n#include <string>\n#include \"logos_module_context.h\"\n\n/// Probes the delivery_module pinned by the release set. Subscribes\n/// to nodeStarted before the node comes up, so the event assertion\n/// does not depend on the node finding peers.\nclass ProbeDeliveryImpl : public LogosModuleContext\n{\npublic:\n    /// Subscribes to delivery_module's nodeStarted event.\n    std::string subscribe();\n\n    /// Description of the last nodeStarted event, or \"\" if none yet.\n    std::string lastNodeStarted();\n\n    /// Round-trips a call into delivery_module and returns what it said.\n    std::string nodeInfo(const std::string& what);\n\nprivate:\n    std::string m_lastNodeStarted;\n};\n```"}, {"execs": [], "md": "### 5.6 Write the implementation\n\n```cpp\n#include \"probe_delivery_impl.h\"\n\n// modules() needs the generated aggregate to be a complete type, so\n// the cross-module calls live here rather than in the header.\n#include \"logos_sdk.h\"\n\nstd::string ProbeDeliveryImpl::subscribe()\n{\n    const bool ok = modules().delivery_module.onNodeStarted(\n        [this](bool success, const std::string& message, int64_t timestamp) {\n            m_lastNodeStarted = std::string(\"success=\") +\n                (success ? \"true\" : \"false\") +\n                \" message=\" + message +\n                \" timestamp=\" + std::to_string(timestamp);\n        });\n    return ok ? \"ok\" : \"failed\";\n}\n\nstd::string ProbeDeliveryImpl::lastNodeStarted()\n{\n    return m_lastNodeStarted;\n}\n\nstd::string ProbeDeliveryImpl::nodeInfo(const std::string& what)\n{\n    auto result = modules().delivery_module.getNodeInfo(what);\n    // Self-describing so the doc-test can assert the call actually\n    // succeeded rather than that something was printed.\n    return result.success ? (\"probe-call-ok \" + result.value.dump())\n                          : (\"probe-call-failed \" + result.error);\n}\n```"}, {"execs": [], "md": "### 5.7 Build it as a portable package\n\n`#lgx-portable`, not `#lgx`. The host is a released (portable) AppImage\nand the delivery module came from the catalog as a portable variant; a\ndev build would RPATH into `/nix/store` and refuse to load beside them.\nNix only sees files git knows about, so the probe is committed first.\nThe link is named after the target CI cross-builds for Windows, so\nthe next step reads the same path on every platform.\n\n```bash\ngit init && git add -A\nnix build '.#lgx-portable' -o ../probe-delivery\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session package install --file probe-delivery/*.lgx -y", "exit_code": 0, "kind": "run", "output": "{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"D:\\\\a\\\\logos-release-set\\\\logos-release-set\\\\stage\\\\probe-delivery\\\\logos-probe_delivery-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"probe_delivery\",\"signature\":\"unsigned\",\"toVersion\":\"1.0.0\"}],\"installed\":[\"probe_delivery\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.8 Install the probe\n\nA path ending in `.lgx` is read as a file, so this never touches the\ncatalog. The probe is unsigned and installs anyway: the session's\n`signature_policy` defaults to `warn`.\n\nOn Windows, `probe-delivery/` holds the probe CI cross-built with the\nsame pinned builder from `doctests/probes/delivery`: the files above,\nwhich `scripts/check-probes.py` keeps identical to this spec.\n\n```bash\nlogosctl package install --file probe-delivery/*.lgx -y\n```"}, {"execs": [], "md": "## Step 6: Load the modules and subscribe\n\nEverything installed into the running daemon, which re-scanned each time.\nLoad both modules, then register the probe's subscription \u2014 before any\nlifecycle call, so nothing is missed."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load delivery_module", "exit_code": 0, "kind": "run", "output": "{\"dependencies_loaded\":[],\"module\":\"delivery_module\",\"optional_skipped\":[{\"module\":\"libp2p_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"},{\"module\":\"liblogos_rln_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"0.3.0\"}\n", "status": "pass"}], "md": "### 6.1 Load delivery_module\n\n```bash\nlogosctl module load delivery_module\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session module load probe_delivery", "exit_code": 0, "kind": "run", "output": "{\"dependencies_loaded\":[],\"module\":\"probe_delivery\",\"optional_skipped\":[{\"module\":\"libp2p_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"},{\"module\":\"liblogos_rln_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 6.2 Load the probe\n\n```bash\nlogosctl module load probe_delivery\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_delivery subscribe", "exit_code": 0, "kind": "run", "output": "{\"method\":\"subscribe\",\"module\":\"probe_delivery\",\"result\":\"ok\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 6.3 Subscribe\n\n```bash\nlogosctl call probe_delivery subscribe\n```"}, {"execs": [], "md": "## Step 7: Initialize the node\n\nThe [Run a Logos node](https://docs.logos.co/run-a-node) guide's delivery\nstep: a kernel-only node, which is what a node operator runs. The\n`logos.test` preset supplies the network's bootstrap settings. A kernel\nnode relays, but has no messaging client, so `send`, `subscribe` and the\n`channel*` calls are unavailable while `getNodeInfo` keeps working.\n\nThe guide's `\"nat\": \"extip:<public-ip>\"` is dropped: a CI runner has no\npublic IP, and outbound-only is enough to bring the node up."}, {"execs": [{"cmd": "write delivery-config.json", "exit_code": 0, "kind": "file", "output": "wrote delivery-config.json\n", "status": "pass"}], "md": "### 7.1 Write the node config\n\n```json\n{\n  \"entryLayer\": \"kernel\",\n  \"kernelConf\": {\n    \"preset\": \"logos.test\",\n    \"relay\": true,\n    \"logLevel\": \"INFO\",\n    \"tcpPort\": 30303,\n    \"discv5UdpPort\": 9000,\n    \"discv5Discovery\": true\n  }\n}\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call delivery_module createNode @delivery-config.json", "exit_code": 0, "kind": "run", "output": "{\"method\":\"createNode\",\"module\":\"delivery_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.2 createNode\n\n```bash\nlogosctl call delivery_module createNode @delivery-config.json\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call delivery_module start", "exit_code": 0, "kind": "run", "output": "{\"method\":\"start\",\"module\":\"delivery_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.3 start\n\n```bash\nlogosctl call delivery_module start\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call delivery_module getAvailableNodeInfoIDs\n./bin/logosctl --config-dir ./session call delivery_module getNodeInfo Version\n./bin/logosctl --config-dir ./session call delivery_module getNodeInfo MyBoundPorts\n", "exit_code": 0, "kind": "run", "output": "{\"method\":\"getAvailableNodeInfoIDs\",\"module\":\"delivery_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"[\\\"Version\\\",\\\"Metrics\\\",\\\"MyMultiaddresses\\\",\\\"MyENR\\\",\\\"MyPeerId\\\",\\\"MyBoundPorts\\\",\\\"MyMixPubKey\\\",\\\"MaxMessageSize\\\",\\\"IsRunning\\\"]\"},\"status\":\"ok\"}\n{\"method\":\"getNodeInfo\",\"module\":\"delivery_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"v0.39.0-gca2814\"},\"status\":\"ok\"}\n{\"method\":\"getNodeInfo\",\"module\":\"delivery_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"{\\\"tcp\\\":0,\\\"webSocket\\\":0,\\\"quic\\\":0,\\\"rest\\\":0,\\\"discv5Udp\\\":0,\\\"metrics\\\":0}\"},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.4 Verify the node is up\n\n```bash\nlogosctl call delivery_module getAvailableNodeInfoIDs\nlogosctl call delivery_module getNodeInfo Version\nlogosctl call delivery_module getNodeInfo MyBoundPorts\n```"}, {"execs": [], "md": "## Step 8: Read the results back through the probe\n\nBoth halves of the contract, observed from inside the runtime: a call the\nprobe made into `delivery_module`, and an event `delivery_module` pushed\nto the probe."}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session call probe_delivery nodeInfo Version", "exit_code": 0, "kind": "run", "output": "{\"method\":\"nodeInfo\",\"module\":\"probe_delivery\",\"result\":\"probe-call-ok \\\"v0.39.0-gca2814\\\"\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.1 The probe's own call\n\n```bash\nlogosctl call probe_delivery nodeInfo Version\n```"}, {"execs": [{"cmd": "out=\"\"\nfor i in $(seq 1 30); do\n  out=\"$(./bin/logosctl --config-dir ./session call probe_delivery lastNodeStarted 2>&1)\"\n  case \"$out\" in *'\"result\":\"success=true'*) break ;; esac\n  sleep 2\ndone\nprintf '%s\\n' \"$out\"\n", "exit_code": 0, "kind": "run", "output": "{\"method\":\"lastNodeStarted\",\"module\":\"probe_delivery\",\"result\":\"success=true message= timestamp=1790940976149185000\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 8.2 The event the probe caught\n\n`start` returns as soon as the node accepts the call; `nodeStarted` is\nemitted later, by the completion callback. How much later depends on\nthe runner, so this polls for the latched event instead of sleeping a\nfixed interval and hoping \u2014 a three-second sleep was enough on some\nruns and not others, which is the definition of a flaky test.\n\n```bash\nlogosctl call probe_delivery lastNodeStarted\n```\n\nThat event was emitted by the pinned `delivery_module` as its node\nfinished starting, delivered over the runtime's event channel, and\ncaptured by a module built with the pinned `logos-module-builder`."}, {"execs": [], "md": "## Step 9: Expose the metrics endpoint\n\n`/metrics` is served by the **`openmetrics`** module itself: it runs an HTTP\nserver (libmicrohttpd) and, on every scrape, calls the metrics convention\nmethod on each module named in its config, merging the results into one\nOpenMetrics document with a `module=\"<name>\"` label injected per series.\n\n`delivery_module` is the *other* kind of source: it already speaks\nOpenMetrics and returns a rendered document from\n`collectOpenMetricsText()`, which the scraper parses back and merges. That\nconvention is selected per module with `\"format\": \"text\"` \u2014 naming it as a\nbare string would call the structured `collectMetrics()` it does not\nimplement."}, {"execs": [], "md": "### 9.1 Load the scraper\n\n```bash\nlogosctl module load openmetrics\n```"}, {"execs": [], "md": "### 9.2 Point it at the delivery module\n\n```json\n{\n  \"port\": 9465,\n  \"modules\": [\n    { \"name\": \"delivery_module\", \"format\": \"text\" }\n  ]\n}\n```"}, {"execs": [], "md": "### 9.3 Start the server\n\n```bash\nlogosctl call openmetrics start @openmetrics.json\n```"}, {"execs": [], "md": "### 9.4 Confirm it is serving\n\n```bash\nlogosctl call openmetrics getInfo\n```"}, {"execs": [], "md": "### 9.5 Scrape /metrics\n\nOne HTTP request drives a live collection call into `delivery_module`\nfrom the server thread; the text it returns is parsed and re-rendered\nwith a `module=\"delivery_module\"` label on every series.\n\n```bash\ncurl http://127.0.0.1:9465/metrics\n```"}, {"execs": [], "md": "### 9.6 Stop the server\n\n```bash\nlogosctl call openmetrics stop\n```"}, {"execs": [], "md": "## Step 10: Shut down\n\nStop the daemon and confirm it exited cleanly."}, {"execs": [{"cmd": "trap '' TERM\n./bin/logosctl --config-dir ./session daemon stop || true\ntrue\n", "exit_code": 0, "kind": "run", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 10.1 Stop\n\n```bash\ntrap '' TERM\n./bin/logosctl --config-dir ./session daemon stop || true\ntrue\n\n```"}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./bin/logosctl --config-dir ./session daemon status || true", "exit_code": 0, "kind": "run", "output": "{\"daemon\":{\"instance_id\":\"7d569a8abb40\",\"status\":\"not_running\",\"version\":\"0.3.1\"},\"modules\":[],\"rpc_error\":\"core_service not reachable\"}\n", "status": "pass"}], "md": "### 10.2 Confirm\n\n```bash\nlogosctl daemon status\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
