means for what is testable\n\n## Prerequisites\n\n- **A Linux or macOS machine** (linux-x86_64, linux-arm64 or macos-arm64), or the Windows leg's staged tree.\n- **On Windows:** `basecamp-setup/`, `logosctl/`, `lgpm/` and `release-set/` staged by logos-windows-ci, plus Git Bash. A Basecamp already installed for the same user keeps its registration: the leg saves it before installing and restores it after uninstalling.\n- **On Linux:** the usual desktop graphics libraries (`libopengl0`, `libgl1`, `libegl1`). The portable bundle loads them from the host, exactly as it would on a real desktop.\n- **`RELEASE_SET_DIR`** pointing at the `logos-release-set` checkout, and **`GITHUB_TOKEN`** set (resolving the set hits the GitHub API)."}, {"execs": [], "md": "## Step 1: Resolve the release set\n\nThe resolver turns the pinned tags and versions into\n`release-set.lock.json` \u2014 repository URL, commit, download URL and checksum\nfor every artifact."}, {"execs": [], "md": "### 1.1 Resolve\n\n```bash\n./doctests/release-set.sh lock\n```"}, {"execs": [{"cmd": "bash release-set/windows.sh pins", "exit_code": 0, "kind": "run", "output": "  logos-basecamp  0.3.2\n  logos-logoscore-cli  0.3.2\n  logos-package-manager  0.3.1\n  logos-module-builder  0.3.3\n  logos-module  0.3.0\n  logos-package  0.1.0\n  blockchain_module  0.3.0\n  chat_module  0.3.0\n  delivery_module  0.3.2\n  lez_core  0.5.0\n  lez_indexer_module  1.2.0\n  liblogos_lez_rln_module  4.2.1\n  liblogos_rln_module  0.10.0\n  libp2p_module  1.1.0\n  openmetrics  0.1.2\n  storage_module  3.0.2\n  blockchain_ui  0.3.1\n  chat_ui  0.3.0\n  lez_explorer_ui  1.2.0\n  lez_wallet_ui  1.2.0\n  storage_ui  3.0.2\n", "status": "pass"}], "md": "### 1.2 Read the pins\n\nWindows resolves nothing. CI read the lock on Linux to stage the\npinned installer and tools, and staged `release-set.json` with a\nhelper that reads it.\n\n```bash\nbash release-set/windows.sh pins\n```"}, {"execs": [], "md": "## Step 2: Fetch the package tools\n (3adbed3020e0\u00e2\u20ac\u00a6)\nInstalling from file: D:/a/logos-release-set/logos-release-set/stage/packages/storage_ui-3.0.2.lgx...Warning: Package is unsigned: D:/a/logos-release-set/logos-release-set/stage/packages/storage_ui-3.0.2.lgx\n done\nInstalled to: ./testdata/plugins\n", "status": "pass"}], "md": "### 3.2 Install everything that publishes a Windows variant\n\nThe same two commands per package. With no lock on Windows, the helper\ntakes each expected `sha256`, and whether a Windows variant exists,\nfrom the catalog index the resolver reads.\n\n```bash\nlogosctl --config-dir ./session package download <each> --version <pinned> -o packages\nlgpm --modules-dir ./testdata/modules --ui-plugins-dir ./testdata/plugins \\\n     install --file packages/<each>.lgx\n```"}, {"execs": [{"cmd": "echo \"--- core modules ---\"; ls testdata/modules\necho \"--- ui plugins ---\";   ls testdata/plugins\n", "exit_code": 0, "kind": "run", "output": "--- core modules ---\nchat_module\ndelivery_module\nliblogos_rln_module\nopenmetrics\nstorage_module\n--- ui plugins ---\nchat_ui\nstorage_ui\n", "status": "pass"}], "md": "### 3.3 See what landed where\n\n```bash\nls testdata/modules\nls testdata/plugins\n```"}, {"execs": [{"cmd": "trap '' TERM\n./bin/logosctl --config-dir ./session daemon stop || true\ntrue\n", "exit_code": 0, "kind": "run", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.4 Stop the download daemon\n\n```bash\nlogosctl --config-dir ./session daemon stop\n```"}, {"execs": [], "md": "## Step 4: Fetch the shipped Basecamp artifact\n\nThe release asset itself: an AppImage on Linux (extracted rather than\nmounted \u2014 CI runners have no FUSE), a `.dmg` on macOS, and on Windows the\ninstaller, run the way a user would get Basecamp onto the machine."}, {"execs": [], "md": "### 4.1 Fetch Basecamp\n\n```bash\n./doctests/release-set.sh fetch logos-basecamp LogosBasecamp\n```\n\nIf the pinned release publishes no artifact for this platform the step\nreports `SKIP:` and the spec is skipped rather than failed \u2014 the\nrelease description then lists the platform as not validated."}, {"execs": [{"cmd": "bash release-set/windows.sh basecamp-install basecamp-install", "exit_code": 0, "kind": "run", "output": "==> LogosBasecamp-setup.exe /S /D=D:\\a\\logos-release-set\\logos-release-set\\stage\\basecamp-install\n    installed Logos Basecamp 0.3.2, the pinned release, into D:\\a\\logos-release-set\\logos-release-set\\stage\\basecamp-install\n", "status": "pass"}, {"cmd": "check file: basecamp-install/bin/LogosBasecamp.exe", "exit_code": 0, "kind": "check_file", "output": "basecamp-install/bin/LogosBasecamp.exe\n", "status": "pass"}], "md": "### 4.2 Install Basecamp\n\nThe pinned release's `setup.exe` is staged as `basecamp-setup/`. `/S`\ninstalls silently for the current user, with no elevation, into the\nfolder `/D=` names: here, one inside this run. A silent install takes\nthe installer's *install* mode, so it also adds the Start Menu and\ndesktop shortcuts and registers an uninstaller. Anything an existing\nBasecamp installation has registered there is saved first. The\nhelper then checks the registered version is the pinned one.\n\n```bash\nLogosBasecamp-Desktop-<version>-x86_64-setup.exe /S /D=<install folder>\n```"}, {"execs": [], "md": "## Step 5: Launch it headless and watch it\n\n`QT_QPA_PLATFORM=offscreen` renders to an offscreen buffer, so no display\nis needed. The app gets the populated user directory and 45 seconds to\nboot, load its plugins, and settle."}, {"execs": [], "md": "### 5.1 Launch\n\nLaunched through its real path rather than the `./bin` symlink:\nBasecamp locates its embedded modules and plugins relative to its own\nexecutable, and on macOS that resolution follows the invocation path,\nso a symlinked launch would look for them beside the symlink.\n\n```bash\nQT_QPA_PLATFORM=offscreen LogosBasecamp --user-dir ./testdata > basecamp.log &\n```"}, {"execs": [{"cmd": "mkdir -p app-home\nHOME=\"$(cygpath -m \"$PWD\")/app-home\" USERPROFILE=\"$(cygpath -w \"$PWD\")\\\\app-home\" \\\nQT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 LOGOS_NO_SCHEME_REGISTER=1 \\\n  ./basecamp-install/bin/LogosBasecamp.exe --user-dir \"$PWD/testdata\" \\\n  > basecamp.log 2>&1 &\necho $! > basecamp.pid\nsleep 45\n", "exit_code": 0, "kind": "run", "output": "", "status": "pass"}], "md": "### 5.2 Launch\n\nThe installed copy, from its `bin/`. Two settings differ from the\nother platforms. `QT_FORCE_STDERR_LOGGING=1` sends Qt's messages to\nthe log file: a GUI program with no console otherwise writes them\nto the Windows debugger. `LOGOS_NO_SCHEME_REGISTER=1` stops it taking\nover the `basecamp://` handler, which a Basecamp already installed\nfor this user owns. Its `HOME` and `USERPROFILE` stay inside this\nrun.\n\n```bash\nset QT_QPA_PLATFORM=offscreen\n\"<install folder>\\bin\\LogosBasecamp.exe\" --user-dir .\\testdata > basecamp.log\n```"}, {"execs": [], "md": "### 5.3 Check it is still alive and clean\n\nThree assertions: the process survived the boot, the QML engine did not\nfail to load a component, and no plugin failed to load. A shipping\nbinary that starts and stays up on a full user-dir is what this spec\nexists to prove.\n\n```bash\nkill -0 \"$(cat basecamp.pid)\"          # still running?\ngrep -F \"Cannot load library\" basecamp.log   # nothing failed to load?\n```\n\nThe shipped artifact boots on a user directory built entirely from this\nrelease set. For assertions about what the UI actually *shows*, see\n[`basecamp-ui`](basecamp-ui.md) \u2014 same commit, inspector enabled."}, {"execs": [{"cmd": "set +e\npid=\"$(cat basecamp.pid)\"\nfailed=0\n\nif bash release-set/windows.sh alive \"$pid\"; then\n  echo \"process alive after boot\"\nelse\n  echo \"FAIL: process exited during boot\"; failed=1\nfi\n\nfor pattern in \\\n  \"QQmlApplicationEngine failed\" \\\n  \"Cannot load library\" \\\n  \"is not a type\" \\\n  \"Failed to ill alive and clean\n\nThe same three assertions. Git Bash's `kill` would end only the one\nprocess, so the helper stops the whole tree with `taskkill /T`: the\n`logos_host.exe` processes it started go too, which the uninstall\nafter this needs.\n\n```bash\ntasklist /FI \"PID eq <pid>\"                  # still running?\nfindstr /C:\"Cannot load library\" basecamp.log   # nothing failed to load?\n```"}, {"execs": [], "md": "## Step 6: Uninstall it\n\nThe installer's other half. Run in place with `_?=`, the uninstaller\nwaits until it is done, and cannot delete itself or its folder; it has to\nremove everything else, including the registry keys the install wrote.\nWhatever an existing installation had registered is then put back."}, {"execs": [{"cmd": "bash release-set/windows.sh basecamp-uninstall basecamp-install", "exit_code": 0, "kind": "run", "output": "==> Uninstall.exe /S _?=D:\\a\\logos-release-set\\logos-release-set\\stage\\basecamp-install\n    removed the installed tree\n    removed its registry keys\n", "status": "pass"}], "md": "### 6.1 Uninstall Basecamp\n\n```bash\n\"<install folder>\\Uninstall.exe\" /S\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
