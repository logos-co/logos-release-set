o the\nfolder `/D=` names: here, one inside this run. A silent install takes\nthe installer's *install* mode, so it also adds the Start Menu and\ndesktop shortcuts and registers an uninstaller. Anything an existing\nBasecamp installation has registered there is saved first. The\nhelper then checks the registered version is the pinned one.\n\n```bash\nLogosBasecamp-Desktop-<version>-x86_64-setup.exe /S /D=<install folder>\n```"}, {"execs": [], "md": "## Step 5: Launch it headless and watch it\n\n`QT_QPA_PLATFORM=offscreen` renders to an offscreen buffer, so no display\nis needed. The app gets the populated user directory and 45 seconds to\nboot, load its plugins, and settle."}, {"execs": [{"cmd": "APP=\"$(\"$RELEASE_SET_DIR/doctests/release-set.sh\" path LogosBasecamp)\"\necho \"launching $APP\"\nQT_QPA_PLATFORM=offscreen \"$APP\" --user-dir ./testdata \\\n  > basecamp.log 2>&1 &\necho $! > basecamp.pid\nsleep 45\n", "exit_code": 0, "kind": "run", "note": "", "output": "launching /home/runner/work/_temp/doctest-test-zjoxyhye/.fetch/logos-basecamp/squashfs-root/AppRun\n", "status": "pass"}], "md": "### 5.1 Launch\n\nLaunched through its real path rather than the `./bin` symlink:\nBasecamp locates its embedded modules and plugins relative to its own\nexecutable, and on macOS that resolution follows the invocation path,\nso a symlinked launch would look for them beside the symlink.\n\n```bash\nQT_QPA_PLATFORM=offscreen LogosBasecamp --user-dir ./testdata > basecamp.log &\n```"}, {"execs": [], "md": "### 5.2 Launch\n\nThe installed copy, from its `bin/`. Two settings differ from the\nother platforms. `QT_FORCE_STDERR_LOGGING=1` sends Qt's messages to\nthe log file: a GUI program with no console otherwise writes them\nto the Windows debugger. `LOGOS_NO_SCHEME_REGISTER=1` stops it taking\nover the `basecamp://` handler, which a Basecamp already installed\nfor this user owns. Its `HOME` and `USERPROFILE` stay inside this\nrun.\n\n```bash\nset QT_QPA_PLATFORM=offscreen\n\"<install folder>\\bin\\LogosBasecamp.exe\" --user-dir .\\testdata > basecamp.log\n```"}, {"execs": [{"cmd": "set +e\npid=\"$(cat basecamp.pid)\"\nfailed=0\n\nif kill -0 \"$pid\" 2>/dev/null; then\n  echo \"process alive after boot\"\nelse\n  echo \"FAIL: process exited during boot\"; failed=1\nfi\n\nfor pattern in \\\n  \"QQmlApplicationEngine failed\" \\\n  \"Cannot load library\" \\\n  \"is not a type\" \\\n  \"Failed to load plugin\"\ndo\n  if grep -qF \"$pattern\" basecamp.log; then\n    echo \"FAIL: log contains: $pattern\"\n    grep -F \"$pattern\" basecamp.log | head -3\n    failed=1\n  fi\ndone\n\nkill \"$pid\" 2>/dev/null || true\nsleep 2\n\necho \"--- last 20 log lines ---\"\ntail -20 basecamp.log\n\nif [ \"$failed\" -eq 0 ]; then echo \"smoke OK\"; else echo \"smoke FAILED\"; fi\nexit \"$failed\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "process alive after boot\n--- last 20 log lines ---\n[2026-10-06 21:29:02.679] [out] [storage_module] INF 2026-10-06 21:29:02.678+00:00 Creating a private key and saving it       tid=4607\n[2026-10-06 21:29:02.679] [out] [storage_module] INF 2026-10-06 21:29:02.678+00:00 Bootstrapping node using a predefined network topics=\"libstorage libstoragelifecycle\" tid=4607 network=\"[logos.test]: Logos testnet\"\n[2026-10-06 21:29:02.680] [out] [storage_module] INF 2026-10-06 21:29:02.678+00:00 AutoNAT client enabled                     topics=\"libstorage libstoragelifecycle\" tid=4607 scheduleInterval=1m numPeersToAsk=3 maxQueueSize=3 minConfidence=0.6\n[2026-10-06 21:29:02.680] [out] [storage_module] INF 2026-10-06 21:29:02.679+00:00 Threadpool started                         topics=\"libstorage libstoragelifecycle\" tid=4607 numThreads=4\n[2026-10-06 21:29:02.696] [info] [logos] [storage_module] StorageModuleImpl::start called\n[2026-10-06 21:29:02.696] [out] [storage_module] WRN 2026-10-06 21:29:02.695+00:00 No key for a QueryResponse                 topics=\"storage repostore\" tid=4607\n[2026-10-06 21:29:02. , "md": "### 5.3 Check it is still alive and clean\n\nThree assertions: the process survived the boot, the QML engine did not\nfail to load a component, and no plugin failed to load. A shipping\nbinary that starts and stays up on a full user-dir is what this spec\nexists to prove.\n\n```bash\nkill -0 \"$(cat basecamp.pid)\"          # still running?\ngrep -F \"Cannot load library\" basecamp.log   # nothing failed to load?\n```\n\nThe shipped artifact boots on a user directory built entirely from this\nrelease set. For assertions about what the UI actually *shows*, see\n[`basecamp-ui`](basecamp-ui.md) \u2014 same commit, inspector enabled."}, {"execs": [], "md": "### 5.4 Check it is still alive and clean\n\nThe same three assertions. Git Bash's `kill` would end only the one\nprocess, so the helper stops the whole tree with `taskkill /T`: the\n`logos_host.exe` processes it started go too, which the uninstall\nafter this needs.\n\n```bash\ntasklist /FI \"PID eq <pid>\"                  # still running?\nfindstr /C:\"Cannot load library\" basecamp.log   # nothing failed to load?\n```"}, {"execs": [], "md": "## Step 6: Uninstall it\n\nThe installer's other half. Run in place with `_?=`, the uninstaller\nwaits until it is done, and cannot delete itself or its folder; it has to\nremove everything else, including the registry keys the install wrote.\nWhatever an existing installation had registered is then put back."}, {"execs": [], "md": "### 6.1 Uninstall Basecamp\n\n```bash\n\"<install folder>\\Uninstall.exe\" /S\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
